<script>/* js/04-plugins.js */
/* Plugin SDK: registry, runtime wrapper, host API, generic editor, file import. */
(() => {
  const PL = HB.plugins = { defs: new Map(), userFiles: [] };
  const CAT_ORDER = ['Keyboards', 'Synth', 'Bass', 'Drums', 'Sampler', 'EQ & Filter', 'Dynamics', 'Space', 'Modulation', 'Distortion', 'Utility'];

  /* ------------------------------------------------------------------
     HB.register(def) — the one call a plugin file makes.
     def = {
       type: 'instrument' | 'effect', id: 'unique.id', name, version, author, category, color, description,
       params: [{id, name, min, max, def, curve:'lin'|'log'|'pow', unit, type:'num'|'int'|'enum'|'bool', options, group, smart, hidden}],
       presets: [{name, params:{...}, data}],
       noteMap: [{note, name}]           // optional: named rows for the step sequencer (drums)
       create(host) -> instance | Promise<instance>
     }
     instance = { noteOn(note, vel01, time), noteOff(note, time), allNotesOff(), setParam(id, value, time),
                  getState(), setState(data), editor(container, api) -> {destroy}, controls(), destroy() }
     host = { ctx, sampleRate, output, input (effects), params, bpm(), loadWorklet(name, source), decode(arrayBuffer),
              setParam(id, v), stateChanged(), on(event, fn), ui, h, icon, dsp, music, param, toast, pickFile }
     ------------------------------------------------------------------ */
  HB.register = function (def) {
    if (!def || typeof def !== 'object') throw new Error('register(def): an object is required');
    if (!def.id || !def.name) throw new Error('A plugin needs an id and a name');
    if (def.type !== 'instrument' && def.type !== 'effect') throw new Error(`${def.id}: type must be 'instrument' or 'effect'`);
    if (typeof def.create !== 'function') throw new Error(`${def.id}: a create(host) function is required`);
    def.params = (def.params || []).map(p => {
      const q = Object.assign({}, p);
      if (q.options) q.type = q.type || 'enum';
      q.type = q.type || 'num';
      if (q.type === 'enum') { q.min = 0; q.max = q.options.length - 1; }
      if (q.type === 'bool') { q.min = 0; q.max = 1; }
      if (q.def == null) q.def = q.type === 'num' || q.type === 'int' ? q.min : 0;
      q.name = q.name || q.id;
      return q;
    });
    def.presets = def.presets || [];
    def.category = def.category || (def.type === 'effect' ? 'Utility' : 'Synth');
    def.color = def.color || '#4e8ff7';
    if (PL._loading) { def.user = true; PL._loading.ids.push(def.id); }
    PL.defs.set(def.id, def);
    HB.bus.emit('plugins:changed');
    return def;
  };

  PL.get = id => PL.defs.get(id);
  PL.list = type => [...PL.defs.values()].filter(d => d.type === type && !d.missing && !d.hidden).sort((a, b) => {
    const ca = CAT_ORDER.indexOf(a.category), cb = CAT_ORDER.indexOf(b.category);
    return (a.user ? 1 : 0) - (b.user ? 1 : 0) || (ca < 0 ? 99 : ca) - (cb < 0 ? 99 : cb) || (a.order || 50) - (b.order || 50) || a.name.localeCompare(b.name);
  });
  PL.missingDef = (id, type) => ({
    id, type, name: 'Missing Plugin', missing: true, params: [], presets: [], category: 'Utility', color: '#6f6f77',
    create(host) { if (host.input) host.input.connect(host.output); return {}; },
  });

  /* ------------------------------------------------------------------ runtime */
  class Runtime {
    constructor(model, ctx, kind) {
      this.model = model; this.ctx = ctx;
      this.def = PL.get(model.pid) || PL.missingDef(model.pid, kind);
      this.kind = this.def.type;
      this.params = model.params = Object.assign(HB.param.defaults(this.def.params), model.params || {});
      this.output = ctx.createGain();
      if (this.kind === 'effect') { this.input = ctx.createGain(); }
      this.ls = new Set(); this.events = new Map();
      this.inst = null; this.loaded = false;
      this.ready = this._init();
    }
    async _init() {
      const rt = this, ctx = this.ctx;
      const host = this.host = {
        ctx, sampleRate: ctx.sampleRate, output: this.output, input: this.input, params: this.params,
        bpm: () => (HB.P ? HB.P.bpm : 120),
        loadWorklet: (name, source, url) => HB.audio.loadWorklet(ctx, name, { source, url }),
        decode: ab => HB.audio.decode(ab, ctx),
        setParam: (id, v) => rt.setParam(id, v, 'plugin'),
        stateChanged: () => { rt.model.data = rt.inst && rt.inst.getState ? rt.inst.getState() : rt.model.data; HB.bus.emit('project:dirty'); },
        on: (ev, fn) => { if (!rt.events.has(ev)) rt.events.set(ev, new Set()); rt.events.get(ev).add(fn); return () => rt.events.get(ev).delete(fn); },
        ui: HB.ui, h: HB.h, icon: HB.icon, dsp: HB.dsp, music: HB.music, param: HB.param, util: HB.util, color: HB.color,
        toast: m => HB.ui.toast(m), pickFile: HB.pickFile, fit: HB.fit, gest: HB.gest,
        offline: !(ctx instanceof (window.AudioContext || window.webkitAudioContext)),
      };
      try {
        this.inst = (await this.def.create(host)) || {};
      } catch (e) {
        console.error('plugin create', this.def.id, e);
        this.error = e; this.inst = {};
        if (this.input) try { this.input.connect(this.output); } catch (_) {}
        HB.ui && HB.ui.toast && HB.ui.toast(`Couldn’t load ${this.def.name}: ${e.message || e}`);
      }
      if (this.inst.setParam) for (const p of this.def.params) { try { this.inst.setParam(p.id, this.params[p.id], ctx.currentTime); } catch (e) { console.warn(e); } }
      if (this.model.data != null && this.inst.setState) { try { await this.inst.setState(this.model.data); } catch (e) { console.warn('setState', e); } }
      this.loaded = true;
      this.emit('ready');
      return this;
    }
    emit(ev, ...a) { const s = this.events.get(ev); if (s) for (const fn of s) { try { fn(...a); } catch (e) { console.error(e); } } }
    on(fn) { this.ls.add(fn); return () => this.ls.delete(fn); }
    setParam(id, v, src) {
      this.params[id] = v;
      if (this.inst && this.inst.setParam) { try { this.inst.setParam(id, v, this.ctx.currentTime); } catch (e) { console.warn(e); } }
      for (const fn of this.ls) fn(id, v, src);
      HB.bus.emit('project:dirty');
    }
    noteOn(n, v, t) { if (this.inst && this.inst.noteOn) this.inst.noteOn(n, v, t == null ? this.ctx.currentTime : t); }
    noteOff(n, t) { if (this.inst && this.inst.noteOff) this.inst.noteOff(n, t == null ? this.ctx.currentTime : t); }
    allNotesOff() { if (this.inst && this.inst.allNotesOff) { try { this.inst.allNotesOff(); } catch (e) { console.warn(e); } } }
    tempo(bpm) { this.emit('tempo', bpm); }
    getState() {
      if (this.inst && this.inst.getState) { try { this.model.data = this.inst.getState(); } catch (e) { console.warn(e); } }
      return { params: Object.assign({}, this.params), data: this.model.data };
    }
    noteMap() { if (this.inst && this.inst.noteMap) return this.inst.noteMap(); return this.def.noteMap || null; }
    controls() {
      if (this.inst && this.inst.controls) return this.inst.controls();
      return this.def.params.filter(p => !p.hidden).map(p => ({ p, get: () => this.params[p.id], set: v => this.setParam(p.id, v, 'ui') }));
    }
    smart() {
      const c = this.controls();
      const s = c.filter(x => x.p.smart);
      return (s.length ? s : c.filter(x => x.p.type !== 'bool')).slice(0, 8);
    }
    async applyPreset(pr) {
      this.model.preset = pr.name;
      const base = HB.param.defaults(this.def.params);
      Object.assign(base, pr.params || {});
      for (const p of this.def.params) this.setParam(p.id, base[p.id], 'preset');
      if (pr.data !== undefined && this.inst && this.inst.setState) { await this.inst.setState(HB.clone(pr.data)); this.model.data = this.inst.getState ? this.inst.getState() : pr.data; }
      for (const fn of this.ls) fn('*', null, 'preset');
      HB.bus.emit('project:dirty');
    }
    destroy() {
      try { if (this.inst && this.inst.destroy) this.inst.destroy(); } catch (e) { console.warn(e); }
      try { this.output.disconnect(); } catch (e) {}
      try { if (this.input) this.input.disconnect(); } catch (e) {}
      this.ls.clear(); this.events.clear();
    }
  }
  PL.Runtime = Runtime;
  PL.instantiate = (model, ctx, kind) => new Runtime(model, ctx || HB.audio.ctx, kind);

  /* ------------------------------------------------------------------ editors */
  PL.openEditor = async function (container, rt) {
    container.innerHTML = '';
    const wait = h('div', { class: 'ed-wait' }, 'Loading…');
    container.appendChild(wait);
    await rt.ready;
    wait.remove();
    if (rt.inst && rt.inst.editor) {
      try {
        const api = PL.editorApi(rt);
        const r = rt.inst.editor(container, api);
        return r || { destroy() {} };
      } catch (e) { console.error(e); container.innerHTML = ''; }
    }
    return PL.genericEditor(container, rt);
  };
  PL.editorApi = rt => ({
    rt, params: rt.params, ui: HB.ui, h: HB.h, icon: HB.icon, color: HB.color, fit: HB.fit, gest: HB.gest, dsp: HB.dsp, music: HB.music,
    setParam: (id, v) => rt.setParam(id, v, 'editor'), getParam: id => rt.params[id], onParam: fn => rt.on(fn),
    param: id => rt.def.params.find(p => p.id === id),
    knob: (id, o = {}) => { const p = rt.def.params.find(x => x.id === id); const k = HB.ui.knob(Object.assign({ p, get: () => rt.params[id], set: v => rt.setParam(id, v, 'editor'), color: rt.def.color }, o)); k.dataset.pid = id; return k; },
    audition: (n, v = 0.8, len = 0.4) => { const t = rt.ctx.currentTime; rt.noteOn(n, v, t); rt.noteOff(n, t + len); },
  });
  PL.genericEditor = function (container, rt) {
    const def = rt.def, api = PL.editorApi(rt);
    const root = h('div', { class: 'ged' });
    if (def.missing) {
      root.appendChild(h('div', { class: 'empty' }, `Plugin ‘${rt.model.pid}’ wasn’t found. Import the plugin file again and its settings will come back.`));
      container.appendChild(root); return { destroy() {} };
    }
    const ctrls = rt.controls();
    const groups = new Map();
    for (const c of ctrls) { const g = c.p.group || 'General'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(c); }
    const widgets = [];
    for (const [g, list] of groups) {
      const card = h('section', { class: 'gcard' }, h('h4', null, g));
      const row = h('div', { class: 'grow-k' });
      for (const c of list) {
        let w;
        if (c.p.type === 'bool') { w = HB.ui.toggle(c.p.name, () => !!c.get(), v => c.set(v ? 1 : 0)); w.classList.add('gtgl'); }
        else if (c.p.type === 'enum' && c.p.options.length <= 5 && c.p.options.join('').length < 26) {
          const wrap = h('div', { class: 'gseg' }, h('label', null, c.p.name)); const s = HB.ui.seg(c.p.options, c.get(), v => c.set(+v)); wrap.appendChild(s); w = wrap; w.update = () => s.set(c.get());
        } else if (c.p.type === 'enum') {
          const wrap = h('div', { class: 'gsel' }, h('label', null, c.p.name)); const s = HB.ui.select(c.p.options, c.get(), v => c.set(+v)); wrap.appendChild(s); w = wrap; w.update = () => { s.value = String(c.get()); };
        } else w = HB.ui.knob({ p: c.p, get: c.get, set: c.set, color: def.color });
        w.dataset.pid = c.p.id; widgets.push(w); row.appendChild(w);
      }
      card.appendChild(row); root.appendChild(card);
    }
    container.appendChild(root);
    const off = rt.on((id) => { for (const w of widgets) if (w.update && (id === '*' || w.dataset.pid === id)) w.update(); });
    return { destroy() { off(); } };
  };

  /* ------------------------------------------------------------------ user presets */
  PL.userPresets = async pid => (await HB.db.get('presets:' + pid)) || [];
  PL.saveUserPreset = async function (rt, name) {
    const list = await PL.userPresets(rt.def.id);
    const st = rt.getState();
    const pr = { name, params: st.params, data: st.data, user: true };
    const i = list.findIndex(p => p.name === name); if (i >= 0) list[i] = pr; else list.push(pr);
    await HB.db.set('presets:' + rt.def.id, list); rt.model.preset = name;
    return pr;
  };
  PL.deleteUserPreset = async function (pid, name) { const list = (await PL.userPresets(pid)).filter(p => p.name !== name); await HB.db.set('presets:' + pid, list); };

  /* ------------------------------------------------------------------ plugin files */
  function runSource(src) {
    // 1) plain Function (needs eval); 2) inline <script> (needs inline scripts); 3) blob script
    try { (new Function('HB', '"use strict";\n' + src + '\n//# sourceURL=hb-plugin.js'))(HB); return Promise.resolve('fn'); }
    catch (e) {
      const csp = e instanceof EvalError || /unsafe-eval|Content Security|Refused/i.test(String(e && e.message));
      if (!csp) return Promise.reject(e);
    }
    return new Promise((res, rej) => {
      HB._plugErr = null;
      const s = document.createElement('script');
      s.textContent = '(function(HB){try{\n' + src + '\n}catch(e){HB._plugErr=e;}})(window.HB);';
      document.head.appendChild(s); s.remove();
      if (PL._loading.ids.length || HB._plugErr) return HB._plugErr ? rej(HB._plugErr) : res('inline');
      const url = URL.createObjectURL(new Blob(['(function(HB){\n' + src + '\n})(window.HB);'], { type: 'application/javascript' }));
      const b = document.createElement('script'); b.src = url;
      b.onload = () => { URL.revokeObjectURL(url); b.remove(); res('blob'); };
      b.onerror = () => { b.remove(); rej(new Error('Plugin code can’t run in this view. Import it in the Home Screen app.')); };
      document.head.appendChild(b);
    });
  }
  PL.loadSource = async function (src, o = {}) {
    if (PL._loading) throw new Error('Another plugin is still loading');
    PL._loading = { ids: [] };
    try { await runSource(src); }
    finally { var ids = PL._loading.ids; PL._loading = null; }
    if (!ids.length) throw new Error('This file has no HB.register(...) call. Check that it’s a Hanbit Studio plugin file.');
    if (o.persist !== false) {
      const list = (await HB.db.get('plugins')) || [];
      const key = ids.join('+');
      const entry = { key, ids, name: o.name || ids.map(i => PL.get(i).name).join(', '), file: o.file || '', source: src, date: Date.now() };
      const i = list.findIndex(x => x.key === key); if (i >= 0) list[i] = entry; else list.push(entry);
      await HB.db.set('plugins', list); PL.userFiles = list;
    }
    HB.bus.emit('plugins:changed');
    return ids.map(i => PL.get(i));
  };
  PL.importFile = async function (file) {
    const src = await file.text();
    return PL.loadSource(src, { file: file.name });
  };
  PL.loadUserPlugins = async function () {
    const list = (await HB.db.get('plugins')) || [];
    PL.userFiles = list;
    for (const e of list) {
      try { await PL.loadSource(e.source, { persist: false }); }
      catch (err) { console.warn('user plugin', e.name, err); e.error = String(err.message || err); }
    }
  };
  PL.removeUser = async function (key) {
    const list = ((await HB.db.get('plugins')) || []);
    const e = list.find(x => x.key === key);
    if (e) for (const id of e.ids) { const d = PL.get(id); if (d && d.user) PL.defs.delete(id); }
    PL.userFiles = list.filter(x => x.key !== key);
    await HB.db.set('plugins', PL.userFiles);
    HB.bus.emit('plugins:changed');
  };
})();

</script>
<script>/* js/05-model.js */
/* Project model, undo/redo, persistence. The model is plain data; the engine reconciles audio to it. */
(() => {
  const M = HB.model = {};
  HB.P = null;
  HB.buffers = new Map();   // bufId -> AudioBuffer
  HB.bufMeta = new Map();   // bufId -> {name, peaks}

  M.newProject = (o = {}) => Object.assign({
    v: 1, id: HB.uid('p'), name: 'New Project', bpm: 120, sig: [4, 4], key: 0, scale: 'major',
    loop: { on: true, start: 0, end: 16 }, metro: false, countIn: true, snap: 0.25, recQuant: 0,
    tracks: [], aux: [
      { id: 'auxA', name: 'Reverb', color: '#6c7dff', fx: [M.fx('hb.fx.reverb', { type: 1, decay: 2.6, mix: 1 })], vol: 0, pan: 0, mute: false },
      { id: 'auxB', name: 'Delay', color: '#38c6d9', fx: [M.fx('hb.fx.delay', { mix: 1, fb: 0.35 })], vol: -3, pan: 0, mute: false },
    ],
    master: { vol: 0, fx: [] }, view: { px: 34, sx: 0, sy: 0, th: 64, pane: 0.44 }, created: Date.now(), updated: Date.now(),
  }, o);
  M.fx = (pid, params, preset) => ({ id: HB.uid('fx'), pid, params: params || {}, data: null, bypass: false, preset: preset || null });
  M.newTrack = (o = {}) => Object.assign({
    id: HB.uid('t'), name: 'Track', kind: 'inst', color: HB.color.PALETTE[(HB.P ? HB.P.tracks.length : 0) % 12],
    inst: o.kind === 'audio' ? null : { pid: 'hb.analog', params: {}, data: null, preset: null },
    fx: [], vol: -3, pan: 0, mute: false, solo: false, arm: false, sendA: 0, sendB: 0, swing: 0, mon: false, regions: [],
  }, o);
  M.newRegion = (o = {}) => Object.assign({ id: HB.uid('r'), start: 0, len: 4, clen: 4, name: '', notes: [] }, o, { clen: o.clen != null ? o.clen : (o.len || 4) });
  M.note = (p, s, l, v = 0.8) => ({ id: HB.uid('n'), p, s, l, v });

  M.track = id => HB.P && (HB.P.tracks.find(t => t.id === id) || HB.P.aux.find(t => t.id === id));
  M.region = id => { for (const t of HB.P.tracks) for (const r of t.regions) if (r.id === id) return { t, r }; return null; };
  M.barLen = () => HB.fmt.barLen(HB.P.sig);
  M.songEnd = () => { let e = 0; for (const t of HB.P.tracks) for (const r of t.regions) e = Math.max(e, r.start + r.len); return e; };
  M.trackIndex = id => HB.P.tracks.findIndex(t => t.id === id);
  M.nextColor = () => HB.color.PALETTE[HB.P.tracks.length % HB.color.PALETTE.length];
  /* iterate the notes a region actually plays (handles looping & left-trim) */
  M.eachNote = function (r, fn, from = -Infinity, to = Infinity) {
    if (!r.notes || !r.notes.length) return;
    const reps = Math.ceil(r.len / r.clen - 1e-9);
    for (let k = 0; k < reps; k++) {
      const off = r.start + k * r.clen;
      if (off >= to || off + r.clen <= from) continue;
      for (const n of r.notes) {
        if (n.s < 0 || n.s >= r.clen) continue;
        const s = off + n.s; if (s >= r.start + r.len) continue;
        if (s < from || s >= to) continue;
        fn(n, s, Math.min(n.l, r.start + r.len - s), k);
      }
    }
  };

  /* ---------------------------------------------------------- history */
  const H = HB.history = { undo: [], redo: [], max: 80 };
  H.snap = () => { if (HB.engine) HB.engine.syncStates(); return HB.clone(HB.P); };
  HB.edit = function (label, fn, what) {
    H.undo.push({ label, s: H.snap() }); if (H.undo.length > H.max) H.undo.shift(); H.redo.length = 0;
    const r = fn();
    HB.changed(what);
    return r;
  };
  HB.changed = function (what) {
    if (!HB.P) return;
    HB.P.updated = Date.now();
    if (HB.engine) HB.engine.reconcile();
    HB.bus.emit('changed', what || 'all');
    M.dirty();
  };
  function restore(s) {
    const cur = HB.P, keep = new Map();
    for (const t of [...cur.tracks, ...cur.aux]) { if (t.inst) keep.set(t.id + ':inst', t.inst); for (const f of t.fx) keep.set(f.id, f); }
    for (const f of cur.master.fx) keep.set(f.id, f);
    const p = HB.clone(s);
    for (const t of [...p.tracks, ...p.aux]) {
      const ki = t.inst && keep.get(t.id + ':inst'); if (ki && ki.pid === t.inst.pid) t.inst = ki;
      t.fx = t.fx.map(f => { const k = keep.get(f.id); return k && k.pid === f.pid ? Object.assign(k, { bypass: f.bypass }) : f; });
    }
    p.master.fx = p.master.fx.map(f => { const k = keep.get(f.id); return k && k.pid === f.pid ? Object.assign(k, { bypass: f.bypass }) : f; });
    p.view = cur.view; p.id = cur.id; p.name = cur.name;
    HB.P = p;
    HB.changed('all');
  }
  H.doUndo = function () {
    const e = H.undo.pop(); if (!e) { HB.ui.toast('Nothing to undo'); return; }
    H.redo.push({ label: e.label, s: H.snap() }); restore(e.s); HB.ui.toast('Undo: ' + e.label, 1400);
  };
  H.doRedo = function () {
    const e = H.redo.pop(); if (!e) { HB.ui.toast('Nothing to redo'); return; }
    H.undo.push({ label: e.label, s: H.snap() }); restore(e.s); HB.ui.toast('Redo: ' + e.label, 1400);
  };

  /* ---------------------------------------------------------- persistence */
  let saveT = null;
  M.dirty = function () { HB.bus.emit('save:state', 'dirty'); clearTimeout(saveT); saveT = setTimeout(M.save, 1400); };
  HB.bus.on('project:dirty', () => { if (HB.P) M.dirty(); });
  M.save = async function () {
    clearTimeout(saveT); saveT = null;
    if (!HB.P || HB.transport && HB.transport.bouncing) return;
    if (HB.engine) HB.engine.syncStates();
    const P = HB.P;
    const ok = await HB.db.set('proj:' + P.id, HB.clone(P));
    const list = (await HB.db.get('projects')) || [];
    const i = list.findIndex(x => x.id === P.id), meta = { id: P.id, name: P.name, updated: P.updated, bpm: P.bpm, tracks: P.tracks.length };
    if (i >= 0) list[i] = meta; else list.unshift(meta);
    await HB.db.set('projects', list);
    HB.local.set('last', P.id);
    HB.bus.emit('save:state', ok ? 'saved' : 'error');
  };
  M.list = async () => ((await HB.db.get('projects')) || []).sort((a, b) => b.updated - a.updated);
  M.remove = async function (id) {
    const P = await HB.db.get('proj:' + id);
    if (P) for (const t of P.tracks) for (const r of t.regions) if (r.buf) await HB.db.del('buf:' + r.buf);
    await HB.db.del('proj:' + id);
    await HB.db.set('projects', (await M.list()).filter(x => x.id !== id));
  };

  /* audio buffers live outside the project record */
  M.addBuffer = async function (buf, name) {
    const id = HB.uid('b');
    HB.buffers.set(id, buf); HB.bufMeta.set(id, { name, peaks: M.peaks(buf) });
    const ch = []; for (let c = 0; c < buf.numberOfChannels; c++) ch.push(buf.getChannelData(c).slice());
    await HB.db.set('buf:' + id, { sr: buf.sampleRate, name, ch });
    return id;
  };
  M.peaks = function (buf, per = 256) {
    const d = buf.getChannelData(0), d2 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : d, n = Math.ceil(d.length / per), out = new Float32Array(n);
    for (let i = 0; i < n; i++) { let m = 0; const e = Math.min(d.length, (i + 1) * per); for (let j = i * per; j < e; j += 2) { const a = Math.max(Math.abs(d[j]), Math.abs(d2[j])); if (a > m) m = a; } out[i] = m; }
    return { per, sr: buf.sampleRate, d: out };
  };
  M.ensureBuffers = async function (P) {
    for (const t of P.tracks) for (const r of t.regions) if (r.buf && !HB.buffers.has(r.buf)) {
      const rec = await HB.db.get('buf:' + r.buf);
      if (rec) { const b = HB.audio.toBuffer(rec.ch, rec.sr); HB.buffers.set(r.buf, b); HB.bufMeta.set(r.buf, { name: rec.name, peaks: M.peaks(b) }); }
    }
  };

  M.load = async function (P) {
    if (HB.transport) HB.transport.stop(true);
    if (HB.P && saveT) await M.save();
    H.undo.length = 0; H.redo.length = 0;
    P.view = Object.assign({ px: 34, sx: 0, sy: 0, th: 64, pane: 0.44 }, P.view || {});
    HB.P = P;
    await M.ensureBuffers(P);
    if (HB.engine) HB.engine.reset();
    HB.sel.clear(); if (P.tracks[0]) HB.sel.track = P.tracks[0].id;

})();

<script>/* js/06-engine.js */
/* Mixer engine: one strip per track/aux/master; reconcile() makes the audio graph match the model. */
(() => {
  const E = HB.engine = { strips: new Map(), master: null };
  const A = HB.audio;

  class FXSlot {
    constructor(model, ctx) {
      this.model = model; this.ctx = ctx;
      this.rt = HB.plugins.instantiate(model, ctx, 'effect');
      this.in = ctx.createGain(); this.out = ctx.createGain(); this.wet = ctx.createGain(); this.dry = ctx.createGain();
      this.in.connect(this.rt.input); this.rt.output.connect(this.wet); this.wet.connect(this.out);
      this.in.connect(this.dry); this.dry.connect(this.out);
      this.byp = null; this.setBypass(!!model.bypass);
    }
    setBypass(b) {
      if (this.byp === b) return; this.byp = b;
      const t = this.ctx.currentTime;
      this.wet.gain.setTargetAtTime(b ? 0 : 1, t, 0.006); this.dry.gain.setTargetAtTime(b ? 1 : 0, t, 0.006);
    }
    destroy() { [this.in, this.out, this.wet, this.dry].forEach(n => { try { n.disconnect(); } catch (e) {} }); this.rt.destroy(); }
  }

  class Strip {
    constructor(id, kind) {
      const c = A.ctx; this.id = id; this.kind = kind; this.c = c;
      this.in = kind === 'master' ? A.masterIn : c.createGain();
      this.pan = c.createStereoPanner(); this.fader = c.createGain(); this.mute = c.createGain();
      this.pan.connect(this.fader); this.fader.connect(this.mute);
      this.split = c.createChannelSplitter(2); this.mute.connect(this.split);
      this.anL = c.createAnalyser(); this.anR = c.createAnalyser(); this.anL.fftSize = this.anR.fftSize = 1024;
      this.split.connect(this.anL, 0); this.split.connect(this.anR, 1);
      if (kind === 'track') { this.sendA = c.createGain(); this.sendB = c.createGain(); this.sendA.gain.value = 0; this.sendB.gain.value = 0; this.mute.connect(this.sendA); this.mute.connect(this.sendB); }
      this.mute.connect(kind === 'master' ? A.masterOut : A.masterIn);
      this.fx = []; this.inst = null; this.lvl = [0, 0]; this.hold = [0, 0]; this.holdT = [0, 0]; this.v = {};

    }
    chain() {
      try { this.in.disconnect(); } catch (e) {}
      for (const f of this.fx) { try { f.out.disconnect(); } catch (e) {} }
      let node = this.in;
      for (const f of this.fx) { node.connect(f.in); node = f.out; }
      node.connect(this.pan);
    }
    set(k, v, fn) { if (this.v[k] === v) return; this.v[k] = v; fn(this.c.currentTime); }
    setVol(db) { this.set('vol', db, t => this.fader.gain.setTargetAtTime(HB.music.dbToGain(db), t, 0.012)); }
    setPan(p) { this.set('pan', p, t => this.pan.pan.setTargetAtTime(clamp(p, -1, 1), t, 0.012)); }
    setMute(m) { this.set('mute', m, t => this.mute.gain.setTargetAtTime(m ? 0 : 1, t, 0.008)); }
    setSends(a, b) {
      if (!this.sendA) return;
      this.set('sa', a, t => this.sendA.gain.setTargetAtTime(a, t, 0.012));
      this.set('sb', b, t => this.sendB.gain.setTargetAtTime(b, t, 0.012));
    }
    destroy() {
      if (this.inst) { this.inst.allNotesOff(); this.inst.destroy(); this.inst = null; }
      for (const f of this.fx) f.destroy(); this.fx = [];
      [this.pan, this.fader, this.mute, this.split, this.sendA, this.sendB].forEach(n => { if (n) try { n.disconnect(); } catch (e) {} });

      const now = performance.now(), out = [];

    next.forEach((f, i) => { if (f.model !== list[i]) { f.model = list[i]; f.rt.model = list[i]; } f.setBypass(!!list[i].bypass); });

    if (!s.inst || s.inst.model !== t.inst || s.inst.model.pid !== t.inst.pid) {
      if (s.inst) { s.inst.allNotesOff(); s.inst.destroy(); }
      s.inst = HB.plugins.instantiate(t.inst, A.ctx, 'instrument');
      s.inst.output.connect(s.in);
      HB.bus.emit('inst:created', t.id, s.inst);
    }
  }
  function strip(id, kind) { let s = E.strips.get(id); if (!s) { s = new Strip(id, kind); E.strips.set(id, s); } return s; }

  E.reconcile = function () {

    for (const t of P.tracks) {
      const s = strip(t.id, 'track'); seen.add(t.id);
      syncInst(s, t); syncFx(s, t.fx);
      s.setVol(t.vol); s.setPan(t.pan); s.setMute(t.mute || (anySolo && !t.solo));
      const auxA = E.strips.get('auxA'), auxB = E.strips.get('auxB');
      if (s.sendA && !s.sendWired && auxA && auxB) { s.sendA.connect(auxA.in); s.sendB.connect(auxB.in); s.sendWired = true; }
      s.setSends(t.sendA || 0, t.sendB || 0);
    }
    for (const [id, s] of E.strips) if (!seen.has(id)) { s.destroy(); E.strips.delete(id); }
  };
  E.reset = function () { for (const s of E.strips.values()) s.destroy(); E.strips.clear(); if (E.master) { E.master.destroy(); E.master = null; } };
  E.strip = id => (id === 'master' ? E.master : E.strips.get(id));
  E.inst = id => { const s = E.strips.get(id); return s && s.inst; };
  E.fxRt = fxId => { for (const s of [E.master, ...E.strips.values()]) if (s) for (const f of s.fx) if (f.model.id === fxId) return f.rt; return null; };
  E.syncStates = function () { for (const s of [E.master, ...E.strips.values()]) if (s) { if (s.inst) s.inst.getState(); for (const f of s.fx) f.rt.getState(); } };
  E.allNotesOff = function () { for (const s of E.strips.values()) if (s.inst) s.inst.allNotesOff(); };
  E.tempo = function (bpm) { for (const s of [E.master, ...E.strips.values()]) if (s) { if (s.inst) s.inst.tempo(bpm); for (const f of s.fx) f.rt.tempo(bpm); } };
  E.ready = async function () { const ps = []; for (const s of E.strips.values()) { if (s.inst) ps.push(s.inst.ready); for (const f of s.fx) ps.push(f.rt.ready); } await Promise.all(ps); };
})();

</script>
<script>/* js/07-transport.js */
/* Transport: look-ahead scheduler with cycle, metronome, count-in, MIDI/audio recording, real-time bounce. */
(() => {
  const T = HB.transport = { playing: false, rec: null, pos: 0, anchorT: 0, anchorB: 0, schedT: 0, cyc: false, sources: [], bouncing: false, jumpNext: false };
  const A = HB.audio, E = HB.engine, M = HB.model;
  const LOOK = 0.12;
  let timer = null;
  const bps = () => HB.P.bpm / 60;
  const uAt = t => T.anchorB + (t - T.anchorT) * bps();
  const tAtU = u => T.anchorT + (u - T.anchorB) / bps();
  function wrap(u) {
    const L = HB.P.loop; if (!T.cyc || u < L.end) return u;
    const len = L.end - L.start; return L.start + ((u - L.end) % len);
  }
  T.uAt = uAt; T.wrap = wrap;
  T.beat = function () {
    if (!T.playing) return T.pos;
    const u = uAt(A.ctx.currentTime - A.latency());

  };
  T.uNow = () => uAt(A.ctx.currentTime - A.latency());

  /* split a time window into wrapped beat pieces */
  function pieces(ta, tb) {
    const u0 = uAt(ta), u1 = uAt(tb), out = [];
    if (!T.cyc) { out.push({ w0: u0, w1: u1, off: 0 }); return out; }
    const L = HB.P.loop, len = L.end - L.start;
    let u = u0;
    while (u < u1 - 1e-9) {
      const k = u < L.end ? 0 : 1 + Math.floor((u - L.end) / len + 1e-9);
      const passStart = k === 0 ? -Infinity : L.end + (k - 1) * len, passEnd = k === 0 ? L.end : L.end + k * len;
      const segEnd = Math.min(u1, passEnd), w0 = k === 0 ? u : L.start + (u - passStart);
      out.push({ w0, w1: w0 + (segEnd - u), off: u - w0, jump: k > 0 && Math.abs(u - passStart) < 1e-6 });
      u = segEnd;

  }

  /* ---- metronome ---- */
  let clicks = null;
  function clickBufs() {
    if (clicks) return clicks;

      const b = A.ctx.createBuffer(1, Math.floor(sr * dur), sr), d = b.getChannelData(0);

  function click(t, accent) {
    const s = A.ctx.createBufferSource(); s.buffer = clickBufs()[accent ? 'hi' : 'lo']; s.connect(A.click); s.start(t);
  }

  /* ---- audio region playback ---- */
  function playAudio(t, r, strip, off, dur) {

    dur = Math.min(dur, buf.duration - off); if (dur <= 0.002) return;
    const s = A.ctx.createBufferSource(), g = A.ctx.createGain(), gv = HB.music.dbToGain(r.gain || 0);

  function schedulePiece(pc, now) {

    const { w0, w1 } = pc;

      for (let b = Math.ceil(w0 / unit - 1e-9) * unit; b < w1 - 1e-9; b += unit) {
        const u = b + pc.off;

  T.setPos = function (b) { b = Math.max(0, b); if (T.playing) T.restart(b); else { T.pos = b; HB.bus.emit('transport'); } };
  T.toStart = () => T.setPos(HB.P.loop.on ? HB.P.loop.start : 0);
  T.nudge = bars => T.setPos(Math.round(T.beat() / M.barLen() + bars) * M.barLen());
  T.tempoChanged = function () { E.tempo(HB.P.bpm); if (T.playing) T.restart(T.beat()); };
  T.loopChanged = function () { if (T.playing && !T.rec) T.restart(T.beat()); };

  /* ---------------------------------------------------------------- recording */
  function recTargets() {
    const P = HB.P, armed = P.tracks.filter(t => t.arm);

    if (audioT.length) {

        rec.audio.recorder.onLevel = v => { rec.audio.lvl = v; };
      } catch (e) { HB.ui.toast(e.message || 'Couldn’t open the microphone'); rec.tracks = rec.tracks.filter(id => !audioT.some(t => t.id === id)); if (!rec.tracks.length) return; }
    }

<script>/* js/16-io.js */
/* File I/O: audio import, Standard MIDI files, project files, drag & drop. */
(() => {
  const IO = HB.io = {};
  const M = HB.model, A = HB.audio;

  /* ---------------------------------------------------------- audio */
  IO.importAudio = async function (track, at = 0, files) {
    files = files || await HB.pickFile('audio/*,.wav,.mp3,.m4a,.aif,.aiff,.caf,.flac,.ogg', true);
    if (!files || !files.length) return;
    let pos = Math.max(0, at);
    for (const f of files) {
      try {
        const buf = await A.decode(await f.arrayBuffer());
        const id = await M.addBuffer(buf, f.name.replace(/\.[^.]+$/, ''));
        let t = track;
        if (!t || t.kind !== 'audio') t = HB.library.addAudioTrack();
        const len = buf.duration * HB.P.bpm / 60;
        HB.edit('Import Audio', () => { const r = M.newRegion({ start: pos, len, name: f.name.replace(/\.[^.]+$/, ''), buf: id, off: 0, gain: 0, notes: undefined }); delete r.notes; t.regions.push(r); HB.sel.setRegion(r.id); }, 'regions');
        pos += Math.ceil(len / M.barLen()) * M.barLen();
        track = t;
      } catch (e) { HB.ui.toast(`${f.name}: this audio file can’t be read`); }
    }
  };

  /* ---------------------------------------------------------- MIDI files */
  IO.parseMidi = function (u8) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength); let p = 0;
    const str = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(u8[p + i]); p += n; return s; };
    const vlq = () => { let v = 0, b; do { b = u8[p++]; v = (v << 7) | (b & 127); } while (b & 128 && p < u8.length); return v; };
    if (str(4) !== 'MThd') throw new Error('This isn’t a MIDI file');
    const hl = dv.getUint32(p); p += 4; const fmt = dv.getUint16(p), ntr = dv.getUint16(p + 2), div = dv.getUint16(p + 4); p += hl;
    const ppq = div & 0x8000 ? 480 : div;
    let tempo = null, sig = null; const tracks = [];
    for (let k = 0; k < ntr && p < u8.length - 8; k++) {
      if (str(4) !== 'MTrk') break;
      const len = dv.getUint32(p); p += 4; const end = p + len;
      let tick = 0, run = 0, name = '';
      const open = new Map(), byCh = new Map();
      while (p < end) {
        tick += vlq();
        let st = u8[p];
        if (st & 0x80) { p++; if (st < 0xf0) run = st; } else st = run;
        if (st === 0xff) {
          const type = u8[p++], l = vlq(), d = u8.subarray(p, p + l); p += l;
          if (type === 0x51 && tempo == null && l >= 3) tempo = 60000000 / ((d[0] << 16) | (d[1] << 8) | d[2]);
          else if (type === 0x58 && sig == null && l >= 2) sig = [d[0], Math.pow(2, d[1])];
          else if (type === 0x03 && !name) name = new TextDecoder().decode(d);
          continue;
        }
        if (st === 0xf0 || st === 0xf7) { const l = vlq(); p += l; continue; }
        const ty = st & 0xf0, ch = st & 15;
        if (ty === 0xc0 || ty === 0xd0) { p += 1; continue; }
        const a = u8[p], b = u8[p + 1]; p += 2;
        if (ty === 0x90 && b > 0) open.set(ch * 128 + a, { t0: tick, v: b / 127 });
        else if (ty === 0x80 || (ty === 0x90 && b === 0)) {
          const o = open.get(ch * 128 + a); if (!o) continue; open.delete(ch * 128 + a);
          if (!byCh.has(ch)) byCh.set(ch, []); byCh.get(ch).push({ p: a, s: o.t0 / ppq, l: Math.max(1 / 64, (tick - o.t0) / ppq), v: o.v });
        }
      }
      p = end;
      for (const [ch, notes] of byCh) tracks.push({ name: name || `Track ${tracks.length + 1}`, ch, notes });
    }
    return { fmt, ppq, tempo: tempo || 120, sig: sig || [4, 4], tracks };
  };
  IO.importMidi = async function (file) {
    file = file || await HB.pickFile('.mid,.midi,audio/midi,audio/x-midi');
    if (!file) return;
    let mf; try { mf = IO.parseMidi(new Uint8Array(await file.arrayBuffer())); } catch (e) { HB.ui.toast(e.message || 'Couldn’t read the MIDI file'); return; }
    if (!mf.tracks.length) { HB.ui.toast('The MIDI file has no notes'); return; }
    const P = HB.P, empty = !P.tracks.some(t => t.regions.length);
    const bl = () => HB.fmt.barLen(P.sig);
    HB.edit('Import MIDI', () => {
      if (empty) { P.bpm = Math.round(mf.tempo * 10) / 10; P.sig = [mf.sig[0], mf.sig[1]]; }
      let first = null;
      for (const tr of mf.tracks) {
        const drum = tr.ch === 9, avg = tr.notes.reduce((a, n) => a + n.p, 0) / tr.notes.length;
        const pid = drum ? 'hb.drums' : avg < 48 ? 'hb.bass' : 'hb.piano', d = HB.plugins.get(pid);
        const t = M.newTrack({ name: tr.name, color: d.color, inst: { pid, params: {}, data: null, preset: null } });
        const s0 = Math.floor(Math.min(...tr.notes.map(n => n.s)) / bl()) * bl(), e = Math.ceil(Math.max(...tr.notes.map(n => n.s + n.l)) / bl() - 1e-6) * bl();

        t.regions.push(r); P.tracks.push(t); if (!first) first = t;
      }
      if (first) HB.sel.track = first.id;

    HB.ui.toast(`${file.name}: imported ${mf.tracks.length} tracks`);
  };
  IO.exportMidi = async function () {
    const P = HB.P, ppq = 480, enc = [];

  /* ---------------------------------------------------------- project files */
  IO.saveProjectFile = async function () {

  /* ---------------------------------------------------------- drag & drop */
  IO.handleFiles = async function (files) {

    window.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) IO.handleFiles([...e.dataTransfer.files]); });
  };
})();

  APP.tempoPrompt = async function () {

  function shortcuts() {

<script>/* js/18-templates.js */
/* Project templates, the example plugin file, SDK snippet, and audio input monitoring. */
(() => {
  const M = HB.model, PL = HB.plugins;

  /* ---------- helpers ---------- */
  function inst(pid, presetName, extra) {
    const d = PL.get(pid), pr = d && presetName ? d.presets.find(p => p.name === presetName) : null;
    return {
      pid, params: Object.assign(pr && pr.params ? HB.clone(pr.params) : {}, extra || {}),
      data: pr && pr.data !== undefined && pr.data !== null ? HB.clone(pr.data) : null, preset: pr ? pr.name : null,
    };
  }
  function fx(pid, presetName, extra) {
    const d = PL.get(pid), pr = d && presetName ? d.presets.find(p => p.name === presetName) : null;
    return M.fx(pid, Object.assign(pr && pr.params ? HB.clone(pr.params) : {}, extra || {}), pr ? pr.name : null);
  }
  const N = (list, v = 0.8) => list.map(x => M.note(x[0], x[1], x[2], x[3] != null ? x[3] : v));
  const chord = (ps, s, l, v) => ps.map(p => [p, s, l, v]);
  function track(o) {
    const t = M.newTrack(o);
    t.regions = (o.regions || []).map(r => M.newRegion(r));

  /* ---------- the lo-fi demo song ---------- */
  const CH = [
    { n: 'Fmaj7', root: 41, ep: [53, 57, 60, 64], pad: [53, 60, 64, 69] },
    { n: 'Em7', root: 40, ep: [52, 55, 59, 62], pad: [52, 59, 62, 67] },
    { n: 'Dm7', root: 38, ep: [50, 53, 57, 60], pad: [50, 57, 60, 65] },
    { n: 'Cmaj7', root: 36, ep: [48, 55, 59, 64], pad: [48, 55, 59, 64] },

  function lofi() {
    const P = M.newProject({ name: 'Hanbit Lo-Fi Demo', bpm: 84, key: 0, scale: 'major', loop: { on: true, start: 0, end: 32 }, countIn: true, snap: 0.25 });
    // drums: two-bar boom-bap pattern
    const K = 36, S = 38, CHH = 42, OHH = 46, RIM = 37, SHK = 70, dn = [];
    const hats = (o, open) => { for (let i = 0; i < 8; i++) { const s = o + i * 0.5; if (open && i === 7) dn.push([OHH, s, 0.5, 0.5]); else dn.push([CHH, s, 0.2, i % 2 ? 0.42 : 0.66]); } dn.push([CHH, o + 1.75, 0.15, 0.3], [CHH, o + 3.75, 0.15, 0.32]); };
    dn.push([K, 0, 0.5, 0.95], [K, 1.75, 0.4, 0.7], [K, 2.5, 0.5, 0.85], [S, 1, 0.5, 0.82], [S, 3, 0.5, 0.86]); hats(0, false);
    dn.push([K, 4, 0.5, 0.95], [K, 4.75, 0.4, 0.62], [K, 6.5, 0.5, 0.88], [K, 7.25, 0.4, 0.55], [S, 5, 0.5, 0.82], [S, 7, 0.5, 0.88], [S, 7.75, 0.2, 0.28], [RIM, 6.25, 0.2, 0.35]); hats(4, true);

    CH.forEach((c, i) => { const o = i * 4; en.push(...chord(c.ep, o, 1.75, 0.68), ...chord(c.ep.slice(1), o + 2.5, 1.2, 0.55)); });
    // pad (bars 5–8)

    // piano melody (bars 5–8)
    const mn = [
      [76, 0, 1, 0.74], [72, 1, 0.5, 0.6], [69, 1.5, 0.5, 0.58], [72, 2, 1.5, 0.66], [76, 3.5, 0.5, 0.62],
      [74, 4, 1.5, 0.72], [71, 5.5, 0.5, 0.58], [67, 6, 1, 0.6], [71, 7, 1, 0.64],
      [72, 8, 1, 0.7], [69, 9, 0.5, 0.58], [65, 9.5, 0.5, 0.55], [69, 10, 1, 0.62], [72, 11, 0.5, 0.6], [74, 11.5, 0.5, 0.64],
      [76, 12, 2.5, 0.74], [74, 14.5, 0.5, 0.6], [71, 15, 1, 0.62],
    ];
    const C = HB.color.PALETTE;
    P.tracks = [
      track({ name: 'Lo-Fi Drums', color: C[2], inst: inst('hb.drums', 'Lo-Fi Tape'), vol: -6.5, sendA: 0.08, swing: 0.4,
        fx: [fx('hb.fx.crush', 'Subtle Lo-Fi')],
        regions: [{ start: 0, len: 24, clen: 8, name: 'Beat', notes: N(dn) }, { start: 24, len: 4, clen: 4, name: 'Variation', notes: N(dn.filter(x => x[1] < 4)) }, { start: 28, len: 4, clen: 4, name: 'Fill', notes: N(fill) }] }),
      track({ name: 'Live Bass', color: C[3], inst: inst('hb.bass', 'Finger P-Bass'), vol: -7, sendA: 0.02,
        fx: [fx('hb.fx.eq8', 'Bass Cleanup')],
        regions: [{ start: 0, len: 32, clen: 16, name: 'Bass', notes: N(bn) }] }),
      track({ name: 'Electric Piano', color: C[0], inst: inst('hb.epiano', 'Lo-Fi Wobble'), vol: -10, pan: -0.15, sendA: 0.22, sendB: 0.12,
        fx: [fx('hb.fx.chorus', 'Subtle')],
        regions: [{ start: 0, len: 32, clen: 16, name: 'Chords', notes: N(en) }] }),
      track({ name: 'WT-1 Glass Pad', color: C[5], inst: { pid: 'hanbit.wt1', params: {}, data: null, preset: 'Glass Pad' }, vol: -11, pan: 0.1, sendA: 0.35,
        regions: [{ start: 16, len: 16, clen: 16, name: 'Pad', notes: N(pn) }] }),
      track({ name: 'Piano Melody', color: C[6], inst: inst('hb.piano', 'Lo-Fi Felt'), vol: -8.5, pan: 0.18, sendA: 0.3, sendB: 0.18,

    P.view.fit = true; P.view.focus = P.tracks[2].regions[0].id;

  /* ---------- beat-making starter ---------- */
  function beat() {
    const P = M.newProject({ name: 'New Beat', bpm: 140, loop: { on: true, start: 0, end: 16 }, snap: 0.25 });
    const dn = [];
    [0, 2.75, 3.5].forEach(s => dn.push([36, s, 0.5, 0.95]));
    dn.push([39, 2, 0.5, 0.85]);
    for (let i = 0; i < 16; i++) dn.push([42, i * 0.25, 0.1, i % 4 === 0 ? 0.7 : 0.45]);
    const bn = [[36, 0, 2.5, 0.9], [36, 2.75, 0.75, 0.8], [39, 3.5, 0.5, 0.75]];
    const C = HB.color.PALETTE;
    P.tracks = [
      track({ name: 'Trap Drums', color: C[2], inst: inst('hb.drums', 'Trap Boom'), vol: -4, regions: [{ start: 0, len: 16, clen: 4, name: 'Pattern', notes: N(dn) }] }),
      track({ name: '808 Bass', color: C[4], inst: inst('hb.analog', 'Synth Bass'), vol: -6, regions: [{ start: 0, len: 16, clen: 4, name: '808', notes: N(bn) }] }),
      track({ name: 'Pluck', color: C[5], inst: inst('hb.analog', 'Pluck'), vol: -10, sendB: 0.25, sendA: 0.15 }),
      track({ name: 'WT-1', color: C[9], inst: { pid: 'hanbit.wt1', params: {}, data: null, preset: 'Glass Pad' }, vol: -12, sendA: 0.3 }),
    ];
    P.master.fx = [fx('hb.fx.limiter', 'Loud')];
    P.view.fit = true; P.view.focus = P.tracks[0].regions[0].id;
    return P;
  }

  /* ---------- live band / recording ---------- */
  function band() {
    const P = M.newProject({ name: 'Band Recording', bpm: 96, loop: { on: false, start: 0, end: 16 }, countIn: true, metro: true });
    const C = HB.color.PALETTE;
    const dn = [[36, 0, 0.5, 0.9], [36, 2.5, 0.5, 0.8], [38, 1, 0.5, 0.85], [38, 3, 0.5, 0.88]];
    for (let i = 0; i < 8; i++) dn.push([42, i * 0.5, 0.2, i % 2 ? 0.45 : 0.65]);
    P.tracks = [
      track({ name: 'Acoustic Drums', color: C[2], inst: inst('hb.drums', 'Acoustic Room'), vol: -5, sendA: 0.12, regions: [{ start: 0, len: 16, clen: 4, name: 'Groove', notes: N(dn) }] }),
      track({ name: 'Live Bass', color: C[3], inst: inst('hb.bass', 'Pick Rock'), vol: -6 }),
      track({ name: 'Organ', color: C[1], inst: inst('hb.organ', 'Rock Crunch'), vol: -10, sendA: 0.1 }),
      track({ name: 'Vocals', kind: 'audio', color: '#3a86e0', inst: null, vol: -3, sendA: 0.2, fx: [fx('hb.fx.eq8', 'Vocal Clarity'), fx('hb.fx.comp', 'Smooth Vocal')] }),
    ];
    P.view.fit = true; P.view.focus = P.tracks[0].regions[0].id;
    return P;
  }

  function empty() {
    const P = M.newProject({ name: 'New Project', bpm: 120, loop: { on: false, start: 0, end: 16 } });
    P.tracks = [track({ name: 'Grand piano', color: HB.color.PALETTE[0], inst: inst('hb.piano', 'Concert Grand'), vol: -6, sendA: 0.15 })];
    P.view.fit = true;
    return P;
  }

  HB.templates = [
    { name: 'Lo-Fi Demo Song', desc: 'Drums · Live Bass · Electric Piano · WT-1 · Piano', icon: 'headphones', color: '#ad6cf3', make: lofi },
    { name: 'Empty Project', desc: 'Start right away with one piano track', icon: 'plus', color: '#4e8ff7', make: empty },
    { name: 'Beat Making', desc: '140 BPM trap drums · 808 · synth', icon: 'pads', color: '#f2c23c', make: beat },
    { name: 'Band Recording', desc: 'Drums · bass · organ · vocal audio track', icon: 'mic', color: '#ef5b55', make: band },
  ];

  /* ---------- audio input monitoring (audio tracks) ---------- */
  const mons = new Map();
  HB.monitor = async function (t) {
    const off = () => { const m = mons.get(t.id); if (m) { try { m.src.disconnect(m.g); m.g.disconnect(); } catch (e) {} mons.delete(t.id); } };
    if (!t.mon || t.kind !== 'audio') { off(); return; }
    try {
      const mic = await HB.transport.mic(), st = HB.engine.strip(t.id); if (!st) return;
      off(); const g = HB.audio.ctx.createGain(); mic.src.connect(g); g.connect(st.in); mons.set(t.id, { src: mic.src, g });
      HB.ui.toast('Input monitoring on · use headphones to avoid feedback', 2200);
    } catch (e) { t.mon = false; HB.ui.toast(e.message || 'Couldn’t open the microphone'); HB.bus.emit('changed', 'tracks'); }
  };
  HB.bus.on('project:loaded', () => { for (const id of [...mons.keys()]) { const m = mons.get(id); try { m.g.disconnect(); } catch (e) {} mons.delete(id); } });

  /* ---------- SDK snippet shown in the library ---------- */
  HB.SDK_SNIPPET = `HB.register({
  type: 'instrument',          // or 'effect'
  id: 'me.mysynth',            // a unique id
  name: 'My Synth', category: 'Synth', color: '#ad6cf3',
  params: [
    { id: 'cut', name: 'Cutoff', min: 80, max: 18000, def: 2000, curve: 'log', unit: 'Hz', smart: true },
    { id: 'rel', name: 'Release', min: 0.01, max: 4, def: 0.4, unit: 's' },
  ],
  presets: [{ name: 'Bright', params: { cut: 9000 } }],
  create(host) {               // host.ctx = AudioContext, host.output = output node
    const out = host.ctx.createBiquadFilter(); out.connect(host.output);
    const vs = host.dsp.voices(16);
    return {
      noteOn(n, vel, t) { /* build oscillators, start them at t, then vs.add(voice) */ },
      noteOff(n, t) { vs.off(n, t); },
      allNotesOff() { vs.all(host.ctx.currentTime); },
      setParam(id, v, t) { if (id === 'cut') host.dsp.smooth(out.frequency, v, t); },
      // optional: getState/setState (saved data), editor(el, api) (custom panel)
    };
  },
});`;

  /* ---------- the bundled example plugin file (glass-bell.hbplug.js) ---------- */
  HB.EXAMPLE_PLUGIN = `/*  Hanbit Studio example plugin — Glass Bell (FM bell)
    Load this file with Library → Plugins → Import Plugin File and it appears
    in the Synth category of the instrument list. Settings saved in your projects come back the next time you open them.
    One file can call HB.register() several times to ship instruments and effects together. */
HB.register({
  type: 'instrument',
  id: 'example.glassbell',
  name: 'Glass Bell (FM)',
  short: 'Glass Bell',
  version: '1.0.0',
  author: 'Hanbit Studio example',
  category: 'Synth',
  color: '#7fd6ff',
  icon: 'bell',
  description: '2-operator FM bell · shimmering keys',
  params: [
    { id: 'ratio', name: 'Ratio', options: ['1:1', '1:2', '1:3.5', '1:1.41', '1:7'], def: 2, smart: true, group: 'FM' },
    { id: 'index', name: 'FM Amount', min: 0, max: 12, def: 4, smart: true, group: 'FM' },
    { id: 'idec', name: 'FM Decay', min: 0.05, max: 6, def: 1.2, curve: 'pow', unit: 's', smart: true, group: 'FM' },
    { id: 'detune', name: 'Detune', min: 0, max: 30, def: 7, unit: 'ct', group: 'FM' },
    { id: 'a', name: 'Attack', min: 0.001, max: 2, def: 0.002, curve: 'pow', unit: 's', group: 'Amp' },
    { id: 'decay', name: 'Decay', min: 0.2, max: 12, def: 3.5, curve: 'pow', unit: 's', smart: true, group: 'Amp' },
    { id: 'r', name: 'Release', min: 0.02, max: 8, def: 1.2, curve: 'pow', unit: 's', smart: true, group: 'Amp' },
    { id: 'tone', name: 'Tone', min: 500, max: 20000, def: 12000, curve: 'log', unit: 'Hz', smart: true, group: 'Amp' },
    { id: 'level', name: 'Level', min: -24, max: 6, def: -4, unit: 'dB', smart: true, group: 'Amp' },
  ],
  presets: [
    { name: 'Glass Bell', params: {} },
    { name: 'Music Box', params: { ratio: 4, index: 2.5, idec: 0.4, decay: 1.6, r: 0.6, tone: 15000 } },
    { name: 'Tubular Bell', params: { ratio: 3, index: 6, idec: 2.5, decay: 7, r: 3, tone: 9000 } },
    { name: 'Soft Rhodes', params: { ratio: 0, index: 1.6, idec: 0.9, decay: 2.5, r: 0.5, tone: 5000, detune: 3 } },
  ],
  create(host) {
    const ctx = host.ctx, P = host.params, D = host.dsp;
    const RATIOS = [1, 2, 3.5, 1.41, 7];
    const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.Q.value = 0.5;
    const level = ctx.createGain();
    tone.connect(level); level.connect(host.output);
    const voices = D.voices(24);

    return {
      noteOn(note, vel, t) {
        const f = D.mtof(note), ratio = RATIOS[P.ratio | 0];
        const amp = ctx.createGain(); amp.gain.value = 0;
        const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-0.6, Math.min(0.6, (note - 64) / 40));
        amp.connect(pan); pan.connect(tone);
        // modulator → carrier frequency (classic FM)
        const mod = ctx.createOscillator(), modAmt = ctx.createGain();
        mod.frequency.value = f * ratio;
        const depth = f * ratio * P.index * (0.4 + 0.6 * vel);
        modAmt.gain.setValueAtTime(depth, t);
        modAmt.gain.setTargetAtTime(depth * 0.04, t + 0.002, P.idec / 3);
        mod.connect(modAmt);
        const cars = [-1, 1].map(s => {
          const c = ctx.createOscillator(); c.frequency.value = f; c.detune.value = s * P.detune;
          modAmt.connect(c.frequency); c.connect(amp); return c;
        });
        const env = D.envOn(amp.gain, t, { a: P.a, d: P.decay, s: 0, peak: 0.22 * (0.3 + 0.7 * vel) });
        [mod, ...cars].forEach(o => o.start(t));
        const v = {
          note, t0: t, rel: false, end: t + P.a + P.decay * 1.6 + 0.1,
          release(t2, r) {
            if (v.rel) return; v.rel = true;
            const e = D.envOff(amp.gain, env, Math.max(t2, t + 0.003), r || P.r);
            v.end = Math.min(v.end, e);
            [mod, ...cars].forEach(o => { try { o.stop(v.end + 0.05); } catch (x) {} });
          },
          kill() { [mod, ...cars].forEach(o => { try { o.stop(); } catch (x) {} }); try { pan.disconnect(); } catch (x) {} },
          done() { try { pan.disconnect(); } catch (x) {} },
        };
        [mod, ...cars].forEach(o => { try { o.stop(v.end + 0.05); } catch (x) {} });
        voices.add(v, ctx.currentTime);
      },
      noteOff(note, t) { voices.off(note, t); },
      allNotesOff() { voices.all(ctx.currentTime); },
      setParam(id, v, t) {
        if (id === 'tone') D.smooth(tone.frequency, v, t);
        else if (id === 'level') D.smooth(level.gain, host.music.dbToGain(v), t);
      },
      destroy() { voices.all(ctx.currentTime); level.disconnect(); },
    };
  },
});
`;
})();

<script>/* js/wt1core.js */
/* WT-1 core: tables, generators, presets, samples — shared with the Studio instrument + sampler. */
HB.WT1Core=(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const TAU=Math.PI*2,N=2048,F=64,NL=11;
const IN_FRAME=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- IndexedDB key-value ---------- */
const DB=(()=>{let p=null;
  function open(){if(p)return p;p=new Promise((res,rej)=>{try{const r=indexedDB.open('hanbit-wt1',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});return p;}
  function tx(mode,fn){return open().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv',mode),s=t.objectStore('kv');const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}));}
  return {get:k=>tx('readonly',s=>s.get(k)).catch(()=>undefined),set:(k,v)=>tx('readwrite',s=>s.put(v,k)).then(()=>true).catch(()=>false),del:k=>tx('readwrite',s=>s.delete(k)).catch(()=>{})};})();

/* ---------- FFT ---------- */
const FFT=(()=>{const n=N,bits=Math.log2(n),rev=new Uint32Array(n);
  for(let i=0;i<n;i++){let r=0;for(let b=0;b<bits;b++)r|=((i>>b)&1)<<(bits-1-b);rev[i]=r;}

  }

<script>/* plugins/inst-piano.js */
/* Studio Piano — additive grand-piano model rendered into multisample zones (inharmonic partials, double decay, hammer noise). */
HB.register((() => {
  const ROOTS = []; for (let n = 24; n <= 108; n += 6) ROOTS.push(n);
  const VERSION = 'pz2';
  function renderZone(n, sr) {
    const f0 = 440 * Math.pow(2, (n - 69) / 12), dur = clamp(9.5 - (n - 24) * 0.085, 2.4, 9.5), N = Math.floor(dur * sr), out = new Float32Array(N);
    const B = 0.00006 * Math.pow(2, (n - 24) / 15), T0 = clamp(13 - (n - 24) * 0.13, 1.3, 13), x0 = 0.122;
    const R = HB.dsp.rand(n * 977 + 13);
    const maxK = Math.min(40, Math.floor(15000 / f0));
    for (let k = 1; k <= maxK; k++) {
      const fk = k * f0 * Math.sqrt(1 + B * k * k); if (fk > sr * 0.45) break;
      const ak = (Math.abs(Math.sin(Math.PI * k * x0)) + 0.06) / Math.pow(k, 1.05) * (k === 1 ? 0.8 : 1);
      if (ak < 0.004) continue;
      const tau = T0 / (1 + 0.0009 * fk * k * 0.35 + 0.012 * k * k * Math.min(1, f0 / 300));
      const cents = 0.12 + R() * 0.35, f2 = fk * Math.pow(2, cents / 1200);
      const w1 = 2 * Math.PI * fk / sr, w2 = 2 * Math.PI * f2 / sr, c1 = Math.cos(w1), s1 = Math.sin(w1), c2 = Math.cos(w2), s2 = Math.sin(w2);
      let x1 = 1, y1 = 0, x2 = Math.cos(R() * 6.28), y2 = Math.sin(R() * 6.28);
      const tf = tau * 0.2, df = Math.exp(-1 / (tf * sr)), ds = Math.exp(-1 / (tau * sr));
      let ef = ak * 0.62, es = ak * 0.38;
      const lim = Math.min(N, Math.floor(tau * sr * 6.5));
      for (let i = 0; i < lim; i++) {
        const nx1 = x1 * c1 - y1 * s1; y1 = x1 * s1 + y1 * c1; x1 = nx1;
        const nx2 = x2 * c2 - y2 * s2; y2 = x2 * s2 + y2 * c2; x2 = nx2;
        out[i] += (y1 + y2) * (ef + es); ef *= df; es *= ds;
      }
    }
    // hammer + thump
    const bp = new HB.dsp.BQ('bp', clamp(f0 * 6, 1500, 6000), 0.8, 0, sr), lp = new HB.dsp.BQ('lp', clamp(f0 * 2, 200, 1200), 0.7, 0, sr);
    const hn = Math.floor(sr * 0.03);

    description: 'Grand piano · brightness follows how hard you play',
    params: [
      { id: 'bright', name: 'Brightness', min: 0, max: 1, def: 0.55, unit: '%', smart: true },
      { id: 'dyn', name: 'Dynamic Range', min: 0, max: 1, def: 0.7, unit: '%', smart: true },
      { id: 'release', name: 'Damper', min: 0.05, max: 1.5, def: 0.3, curve: 'pow', unit: 's', smart: true },
      { id: 'reso', name: 'Resonance', min: 0, max: 1, def: 0.35, unit: '%', smart: true },
      { id: 'width', name: 'Stereo Width', min: 0, max: 1, def: 0.6, unit: '%', smart: true },
      { id: 'tune', name: 'Tuning', min: -50, max: 50, def: 0, unit: 'ct' },
      { id: 'level', name: 'Level', min: -24, max: 6, def: 0, unit: 'dB', smart: true },
    ],
    presets: [
      { name: 'Concert Grand', params: {} },
      { name: 'Soft Upright', params: { bright: 0.3, dyn: 0.5, reso: 0.5, width: 0.4 } },
      { name: 'Pop Bright', params: { bright: 0.85, dyn: 0.55, reso: 0.25, width: 0.8 } },
      { name: 'Lo-Fi Felt', params: { bright: 0.12, dyn: 0.35, release: 0.6, reso: 0.6 } },

    create(host) {
      const ctx = host.ctx, P = host.params, D = HB.dsp;

      bus.gain.value = 0.5; bus.connect(dry); dry.connect(lvl); bus.connect(conv); conv.connect(wet); wet.connect(lvl); lvl.connect(host.output);

            release(t2, r) { if (vo.rel) return; vo.rel = true; if (n >= 90) return; const tt = Math.max(t2, t + 0.01); g.gain.cancelScheduledValues(tt); g.gain.setValueAtTime(amp, tt); g.gain.setTargetAtTime(0, tt, (r || P.release) / 4.5); vo.end = tt + (r || P.release) * 1.4; try { s.stop(vo.end); } catch (e) {} },
            kill() { try { s.stop(); } catch (e) {} try { g.disconnect(); } catch (e) {} } };
          vs.add(vo, ctx.currentTime);
        },
        noteOff(n, t) { vs.off(n, t); },
        allNotesOff() { vs.all(ctx.currentTime); },
        setParam(id, v, t) {
          if (id === 'reso') { D.smooth(wet.gain, v * 0.6, t); D.smooth(dry.gain, 1 - v * 0.2, t); }
          else if (id === 'level') D.smooth(lvl.gain, HB.music.dbToGain(v), t);

      };

})());

  create(host) {

      const ast = D.envOn(amp.gain, t, { a: P.a, d: P.d, s: P.s, peak: vel });
      last = n;
      const vo = { note: n, t0: t, rel: false, end: Infinity,
        release(t2, r) {

        kill() { oscs.forEach(o => { try { o.stop(); } catch (x) {} }); try { amp.disconnect(); } catch (x) {} },

      noteOn(n, v, t) {

      allNotesOff() { vs.all(ctx.currentTime); },

  },

<script>/* plugins/inst-sampler.js */
/* Sampler — load any audio file (or a built-in sound) and play it across the keyboard. */
HB.register({
  type: 'instrument', id: 'hb.sampler', name: 'Sampler', short: 'Sampler', category: 'Sampler', color: '#38c6d9', icon: 'sampler', order: 1,
  description: 'Play audio files across the keys · loop · filter',
  params: [
    { id: 'root', name: 'Root Note', min: 24, max: 96, def: 60, type: 'int', fmt: v => HB.music.name(v), group: 'Sample' },
    { id: 'tune', name: 'Tuning', min: -100, max: 100, def: 0, unit: 'ct', group: 'Sample' },
    { id: 'mode', name: 'Playback', options: ['One-Shot', 'Loop', 'While Held'], def: 2, group: 'Sample', smart: true },
    { id: 'start', name: 'Start', min: 0, max: 0.95, def: 0, unit: '%', group: 'Sample' },
    { id: 'ls', name: 'Loop Start', min: 0, max: 0.99, def: 0.2, unit: '%', group: 'Sample' },
    { id: 'le', name: 'Loop End', min: 0.01, max: 1, def: 0.9, unit: '%', group: 'Sample' },
    { id: 'a', name: 'Attack', min: 0.001, max: 4, def: 0.003, curve: 'pow', unit: 's', group: 'Envelope', smart: true },
    { id: 'd', name: 'Decay', min: 0.01, max: 6, def: 1, curve: 'pow', unit: 's', group: 'Envelope' },
    { id: 's', name: 'Sustain', min: 0, max: 1, def: 1, unit: '%', group: 'Envelope' },
    { id: 'r', name: 'Release', min: 0.01, max: 6, def: 0.25, curve: 'pow', unit: 's', group: 'Envelope', smart: true },
    { id: 'cut', name: 'Filter', min: 80, max: 20000, def: 20000, curve: 'log', unit: 'Hz', group: 'Tone', smart: true },
    { id: 'res', name: 'Resonance', min: 0.3, max: 12, def: 0.7, curve: 'log', group: 'Tone', smart: true },
    { id: 'vsens', name: 'Velocity', min: 0, max: 1, def: 0.6, unit: '%', group: 'Tone' },
    { id: 'level', name: 'Level', min: -24, max: 6, def: 0, unit: 'dB', group: 'Tone', smart: true },
  ],
  presets: [
    { name: 'Voice Pad', params: { mode: 1, a: 0.4, r: 1.2, ls: 0.3, le: 0.8 }, data: { builtin: 'voice' } },
    { name: 'Metal Bell', params: { mode: 0, r: 1.5 }, data: { builtin: 'bell' } },
    { name: 'Guitar Pluck', params: { mode: 2, r: 0.4 }, data: { builtin: 'pluck' } },
    { name: 'Noise Texture', params: { mode: 1, a: 0.6, r: 2, cut: 6000, ls: 0.1, le: 0.95 }, data: { builtin: 'texture' } },
  ],
  create(host) {
    const ctx = host.ctx, P = host.params, D = HB.dsp;
    const lvl = ctx.createGain(); lvl.connect(host.output);
    let data = { builtin: 'pluck' }, buffer = null, peaks = null;
    const vs = D.voices(24);

      if (data && data.sample) { ch = data.sample.ch; sr = data.sample.sr; name = data.sample.name; }
      else if (data && data.builtin && HB.WT1Core) { const k = data.builtin; ch = [HB.WT1Core.builtinSample(k)]; name = HB.WT1Core.SAMPLES[k].name; }

      name: '',

          kill() { try { s.stop(); } catch (x) {} try { g.disconnect(); } catch (x) {} } };

      },
      noteOff(n, t) { vs.off(n, t); },
      allNotesOff() { vs.all(ctx.currentTime); },
      setParam(id, v, t) { if (id === 'level') D.smooth(lvl.gain, HB.music.dbToGain(v), t); },
      getState: () => data,
      setState(d) { data = d || { builtin: 'pluck' }; load(); },
      editor(el, api) {
        const cv = h('canvas', { class: 'smp-wave' }), info = h('div', { class: 'smp-info' });

          const [g, w, hh] = HB.fit(cv); g.fillStyle = '#0f0f11'; g.fillRect(0, 0, w, hh);
          if (!peaks) { g.fillStyle = '#76767e'; g.fillText('No sample loaded', 12, 20); return; }

          for (let x = 0; x < w; x++) { const i = Math.floor(x / w * peaks.length), a = peaks[i] * (hh / 2 - 6); g.fillRect(x, hh / 2 - a, 1, a * 2); }

          mk(P.start, '#f4f4f6', 'Start'); if ((P.mode | 0) === 1) { g.fillStyle = 'rgba(249,207,61,.12)'; g.fillRect(P.ls * w, 0, (P.le - P.ls) * w, hh); mk(P.ls, '#f9cf3d', 'Loop'); mk(P.le, '#f9cf3d', ''); }
        };
        HB.gest(cv, {
          down: p => { const n = p.x / p.w, c = [['start', Math.abs(n - P.start)], ['ls', (P.mode | 0) === 1 ? Math.abs(n - P.ls) : 9], ['le', (P.mode | 0) === 1 ? Math.abs(n - P.le) : 9]].sort((a, b) => a[1] - b[1])[0]; return c[1] < 0.06 ? c[0] : null; },
          move: (p, e, st) => { if (!st.data) return; const n = clamp(p.x / p.w, 0, 1); let v = n; if (st.data === 'ls') v = Math.min(n, P.le - 0.01); if (st.data === 'le') v = Math.max(n, P.ls + 0.01); api.setParam(st.data, v); draw(); },
          tap: () => api.audition(P.root, 0.85, 0.8),
        });
        const src = HB.ui.select([{ value: '', label: 'Choose a built-in sound…' }, ...Object.keys(HB.WT1Core ? HB.WT1Core.SAMPLES : {}).map(k => ({ value: k, label: HB.WT1Core.SAMPLES[k].name }))], data && data.builtin || '', v => { if (!v) return; data = { builtin: v }; load(); host.stateChanged(); upd(); draw(); });
        const upd = () => { info.textContent = buffer ? `${inst.name} · ${buffer.duration.toFixed(2)} s · ${buffer.numberOfChannels === 2 ? 'stereo' : 'mono'} · root ${HB.music.name(P.root)}` : 'Load a sample'; };
        const loadBtn = HB.ui.btn('Load Audio File', async () => {
          const f = await HB.pickFile('audio/*,.wav,.mp3,.m4a,.aif,.aiff,.caf'); if (!f) return;
          try { const ab = await host.decode(await f.arrayBuffer()), n = Math.min(ab.length, ab.sampleRate * 30), ch = []; for (let i = 0; i < Math.min(2, ab.numberOfChannels); i++) ch.push(ab.getChannelData(i).slice(0, n)); data = { sample: { name: f.name.replace(/\.[^.]+$/, ''), sr: ab.sampleRate, ch } }; load(); host.stateChanged(); upd(); draw(); }
          catch (e) { HB.ui.toast('Couldn’t read the audio file'); }
        }, 'pri sm', 'import');
        const row = h('div', { class: 'smp-top' }, loadBtn, src, info);
        const knobs = h('div', { class: 'grow-k' }, ...['root', 'tune', 'a', 'd', 's', 'r', 'cut', 'res', 'vsens', 'level'].map(id => api.knob(id, { size: 's' })));
        const mode = HB.ui.seg(['One-Shot', 'Loop', 'While Held'], P.mode, v => { api.setParam('mode', +v); draw(); });
        el.appendChild(h('div', { class: 'smp' }, row, cv, h('div', { class: 'smp-row' }, mode, h('span', { class: 'note' }, 'Drag on the waveform to set the start point and loop · tap to preview')), knobs));

<script>/* plugins/inst-wt1.js */
/* WT-1 wavetable synth as a Studio instrument: headless engine host + the full WT-1 editor in a window. */
HB.wt1Host = { current: null };
HB.register((() => {
  const W = HB.WT1Core;
  const PK = Object.keys(W.PD).filter(k => !W.PD[k].local), EK = Object.keys(W.ED).filter(k => !W.LOCAL_E.has(k));
  const PI = {}, EI = {}; PK.forEach((k, i) => { PI[k] = i; }); EK.forEach((k, i) => { EI[k] = i; });
  const CURVE = { lin: 0, log: 1, pow: 2 };
  function factoryPatch(fp) {
    const s = W.freshState();
    const set = (k, v) => {
      const m = k.match(/^([ABC])\.src$/); if (m && typeof v === 'string' && v.startsWith('smp:')) { s[m[1] + '.smp'] = v.slice(4); return; }
      if (/^lfo\d+\.pts$/.test(k) && typeof v === 'string') { s[k] = v === 'sine' ? W.sineShape() : W.shapePts(v); return; }
      s[k] = v;
    };
    for (const k in fp.s) set(k, fp.s[k]); for (const k in fp.sx || {}) set(k, fp.sx[k]);
    return { v: 3, s, routes: (fp.r || []).map(([src, dst, amt, bi, curve, aux]) => ({ src, dst, amt, bi: !!bi, curve: curve || 0, aux: aux || null })), tables: {}, samples: {} };
  }
  const PRESETS = W.FACTORY.map(fp => ({ name: fp.name, cat: fp.cat, params: {}, data: null, _fp: fp }));
  Object.defineProperty(PRESETS, 'lazy', { value: true });
  PRESETS.forEach(p => { Object.defineProperty(p, 'data', { get() { return this._d || (this._d = factoryPatch(this._fp)); }, enumerable: true }); });
  const DEFAULT = 'Glass Pad';
  const SMART = ['A.pos', 'A.det', 'f1.cut', 'f1.res', 'env1.a', 'env1.r', 'fx.reverb.mix', 'm1'];

  return {
    type: 'instrument', id: 'hanbit.wt1', name: 'WT-1 Wavetable', short: 'WT-1', category: 'Synth', color: '#ad6cf3', icon: 'synth', order: 1,
    description: '3-oscillator wavetable · warp · 10 LFOs · 13 effects', windowEditor: true,
    params: [], presets: PRESETS,
    async create(host) {
      const ctx = host.ctx;
      await host.loadWorklet('wt1-engine', HB.audio.sources['wt1-engine'], 'wt1-engine.js');
      const node = new AudioWorkletNode(ctx, 'wt1', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
      const out = ctx.createGain(); out.gain.value = 1.4; node.connect(out); out.connect(host.output);
      const post = (m, tr) => node.port.postMessage(m, tr || []);
      node.port.onmessage = e => { const c = HB.wt1Host.current; if (c && c.node === node && c.onViz) c.onViz(e.data); };
      let patch = null, sent = false, gen = 0;
      async function sync() {
        const my = ++gen;
        const s = patch.s = Object.assign(W.freshState(), patch.s || {});
        if (!sent) { post({ t: 'init', pk: PK.map(k => { const d = W.PD[k]; return [k, d.min, d.max, CURVE[d.curve], W.toN(k, s[k])]; }), ek: EK.map(k => [k, +s[k]]), order: s['fx.order'] }); sent = true; }
        else { post({ t: 'nn', i: PK.map((k, i) => i), v: PK.map(k => W.toN(k, s[k])) }); post({ t: 'ee', i: EK.map((k, i) => i), v: EK.map(k => +s[k]) }); post({ t: 'order', a: s['fx.order'] }); }
        post({ t: 'routes', r: (patch.routes || []).filter(r => PI[r.dst] != null && W.SRCIDX[r.src] != null).map(r => [W.SRCIDX[r.src], r.aux && W.SRCIDX[r.aux] != null ? W.SRCIDX[r.aux] : -1, PI[r.dst], r.amt, r.bi ? 1 : 0, r.curve || 0]) });
        for (let i = 1; i <= 10; i++) post({ t: 'lfo', i: i - 1, d: W.lfoTable(s[`lfo${i}.pts`]) });
        for (const X of W.OSCS) {
          if (!s[X + '.on']) continue;
          await new Promise(r => setTimeout(r, 0)); if (my !== gen) return;
          const o = W.OSCS.indexOf(X);
          if (s[X + '.type'] === 0) {
            const tb = patch.tables && patch.tables[X];
            const frames = tb && tb.frames ? tb.frames : W.genFrames(W.GENS[s[X + '.src']] ? s[X + '.src'] : 'basic');
            const m = W.tableMips(frames); post({ t: 'table', o, F: 64, m }, m.map(a => a.buffer));
          } else {
            const sm = patch.samples && patch.samples[X];
            if (sm && sm.d) post({ t: 'sample', o, d: sm.d, sr: sm.sr || 44100 });
            else { const k = W.SAMPLES[s[X + '.smp']] ? s[X + '.smp'] : 'voice'; post({ t: 'sample', o, d: W.builtinSample(k), sr: W.SMP_SR }); }
          }
        }
      }
      const inst = {
        noteOn: (n, v, t) => post({ t: 'on', n, v, at: t }),
        noteOff: (n, t) => post({ t: 'off', n, at: t }),
        allNotesOff: () => post({ t: 'flush' }),
        getState: () => patch,
        async setState(d) { patch = d && d.s ? HB.clone(d) : factoryPatch(W.FACTORY.find(f => f.name === DEFAULT) || W.FACTORY[0]); await sync(); },
        controls() {
          return SMART.map(k => {
            const d = W.PD[k], m = /^m(\d)$/.exec(k);
            const p = { id: k, name: m ? (patch.s['mname' + m[1]] || d.lbl) : d.lbl, min: d.min, max: d.max, def: d.def, curve: d.curve, type: d.int ? 'int' : 'num', fmt: v => d.fmt(v, k), smart: true };
            return { p, label: { 'A.pos': 'WT Position', 'A.det': 'Detune', 'f1.cut': 'Cutoff', 'f1.res': 'Resonance', 'env1.a': 'Attack', 'env1.r': 'Release', 'fx.reverb.mix': 'Reverb' }[k] || p.name,
              get: () => patch.s[k], set: v => { patch.s[k] = v; post({ t: 'n', i: PI[k], v: W.toN(k, v) }); host.stateChanged(); } };
          });
        },
        openWindow(container) {
          const an = ctx.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = 0.78; out.connect(an);
          const rtModel = inst._rt;
          HB.wt1Host.current = {
            ctx, node, analyser: an, patch, meta: { name: rtModel ? rtModel.model.preset : null },
            onPatch(p, meta) { patch = p; if (rtModel && meta) rtModel.model.preset = meta.name; host.stateChanged(); },
          };
          const fr = document.createElement('iframe');
          fr.title = 'WT-1 Editor'; fr.setAttribute('allow', 'autoplay');
          if (HB.audio.sources['wt1-html']) fr.srcdoc = HB.audio.sources['wt1-html']; else fr.src = 'wt1/index.html';
          // the editor drives this track's engine directly, so it must share our origin; otherwise explain instead of running detached
          fr.addEventListener('load', () => {

<script>/* plugins/fx-dynamics-space.js */
/* Compressor, Limiter, Space Reverb, Stereo Delay. */
(() => {
  const D = HB.dsp, MU = HB.music;
  const mixer = (ctx, host) => { const dry = ctx.createGain(), wet = ctx.createGain(); host.input.connect(dry); dry.connect(host.output); wet.connect(host.output); return { dry, wet, set(m, t) { D.smooth(dry.gain, Math.min(1, 2 * (1 - m)), t); D.smooth(wet.gain, Math.min(1, 2 * m), t); } }; };

  /* ------------------------------------------------------------ Compressor */
  HB.register({
    type: 'effect', id: 'hb.fx.comp', name: 'Compressor', short: 'Comp', category: 'Dynamics', color: '#ff9f40', icon: 'knob', order: 1,
    description: 'Dynamics control · parallel mix',
    params: [
      { id: 'thr', name: 'Threshold', min: -60, max: 0, def: -18, unit: 'dB' },
      { id: 'ratio', name: 'Ratio', min: 1, max: 20, def: 4, curve: 'log', fmt: v => v.toFixed(1) + ':1' },
      { id: 'att', name: 'Attack', min: 0.1, max: 200, def: 8, curve: 'log', unit: 'ms' },
      { id: 'rel', name: 'Release', min: 10, max: 1000, def: 160, curve: 'log', unit: 'ms' },
      { id: 'knee', name: 'Knee', min: 0, max: 30, def: 6, unit: 'dB' },
      { id: 'gain', name: 'Makeup', min: 0, max: 24, def: 4, unit: 'dB' },
      { id: 'mix', name: 'Mix', min: 0, max: 1, def: 1, unit: '%' },
    ],
    presets: [
      { name: 'Smooth Vocal', params: { thr: -20, ratio: 3, att: 10, rel: 180, gain: 5 } },
      { name: 'Drum Bus Punch', params: { thr: -16, ratio: 4, att: 25, rel: 120, gain: 4, mix: 0.6 } },
      { name: 'Even Bass', params: { thr: -24, ratio: 6, att: 4, rel: 90, gain: 7 } },
      { name: 'New York Parallel', params: { thr: -35, ratio: 10, att: 1, rel: 80, gain: 12, mix: 0.4 } },
      { name: 'Master Glue', params: { thr: -10, ratio: 2, att: 30, rel: 300, knee: 12, gain: 2 } },
    ],
    create(host) {

          else if (id === 'att') D.smooth(c.attack, v / 1000, t); else if (id === 'rel') D.smooth(c.release, v / 1000, t);
          else if (id === 'knee') D.smooth(c.knee, v, t); else if (id === 'gain') D.smooth(mk.gain, MU.dbToGain(v), t); else if (id === 'mix') mx.set(v, t);
        },
        editor(el, api) { return dynEditor(el, api, c, ['thr', 'ratio', 'att', 'rel', 'knee', 'gain', 'mix'], '#ff9f40'); },
        destroy() { try { host.input.disconnect(); } catch (e) {} },
      };

    },
  });
  function dynEditor(el, api, c, ids, col) {
    const P = api.params, cv = h('canvas', { class: 'dyn-cv' }), gr = h('canvas', { class: 'dyn-gr' });
    const knobs = h('div', { class: 'grow-k' }, ...ids.map(id => api.knob(id)));
    el.appendChild(h('div', { class: 'dyn' }, h('div', { class: 'dyn-l' }, cv, gr), h('div', { class: 'dyn-r' }, knobs)));

    const draw = () => {
      if (!alive) return;

      g.strokeStyle = 'rgba(255,255,255,.07)'; for (let d = -60; d <= 0; d += 12) { const p = (d + 60) / 60 * s; g.beginPath(); g.moveTo(x0 + p, y0); g.lineTo(x0 + p, y0 + s); g.moveTo(x0, y0 + s - p); g.lineTo(x0 + s, y0 + s - p); g.stroke(); }

        o += mk; const px = x0 + (inp + 60) / 60 * s, py = y0 + s - clamp((o + 60) / 60, 0, 1.2) * s;

      }
      g.strokeStyle = col; g.lineWidth = 2.4; g.stroke();
      g.fillStyle = '#76767e'; g.font = '600 10px sans-serif'; g.fillText('Input → Output', x0 + 4, y0 + 12);
      [g, w, hh] = HB.fit(gr);
      const red = -(c.reduction && c.reduction.value != null ? c.reduction.value : c.reduction || 0);
      hold = Math.max(red, hold * 0.97);
      g.fillStyle = '#0f1012'; g.fillRect(0, 0, w, hh);
      const pw = clamp(red / 24, 0, 1) * (w - 70);
      const grd = g.createLinearGradient(0, 0, w, 0); grd.addColorStop(0, col); grd.addColorStop(1, '#ff4a3f');
      g.fillStyle = grd; g.fillRect(60, 6, pw, hh - 12); g.fillStyle = '#e6e6ea'; g.fillRect(60 + clamp(hold / 24, 0, 1) * (w - 70), 4, 2, hh - 8);
      g.fillStyle = '#a6a6ae'; g.font = '600 11px sans-serif'; g.fillText('Gain Reduction', 6, hh / 2 + 4);
      g.fillStyle = '#fff'; g.fillText('-' + red.toFixed(1) + ' dB', w - 64, hh / 2 + 4);
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
    const off = api.onParam(() => knobs.querySelectorAll('.kn').forEach(k => k.update()));
    return { destroy() { alive = false; off(); } };
  }

  /* ------------------------------------------------------------ Limiter */
  HB.register({
    type: 'effect', id: 'hb.fx.limiter', name: 'Limiter', short: 'Limiter', category: 'Dynamics', color: '#ef5b55', icon: 'knob', order: 2,
    description: 'Peak limiter for the master · raise loudness',
    params: [
      { id: 'gain', name: 'Input Gain', min: 0, max: 18, def: 3, unit: 'dB' },
      { id: 'ceil', name: 'Ceiling', min: -12, max: 0, def: -0.3, unit: 'dB' },
      { id: 'rel', name: 'Release', min: 10, max: 800, def: 120, curve: 'log', unit: 'ms' },
    ],
    presets: [{ name: 'Transparent', params: { gain: 2 } }, { name: 'Loud', params: { gain: 8, rel: 60 } }, { name: 'Streaming -1 dB', params: { gain: 4, ceil: -1 } }],
    create(host) {
      // pre gain → fast compressor (catches the body) → soft clipper over ±2 (catches transients, never exceeds 1) → ceiling gain
      const ctx = host.ctx, pre = ctx.createGain(), c = ctx.createDynamicsCompressor(), half = ctx.createGain(), clip = ctx.createWaveShaper(), post = ctx.createGain();
      c.knee.value = 0; c.ratio.value = 20; c.attack.value = 0.0015; c.threshold.value = -2.5; half.gain.value = 0.5;
      const cc = new Float32Array(4097);
      for (let i = 0; i < cc.length; i++) { const x = (i / 2048 - 1) * 2, ax = Math.abs(x); cc[i] = ax < 0.85 ? x : Math.sign(x) * (0.85 + 0.15 * Math.tanh((ax - 0.85) / 0.15)); }

        editor(el, api) { return dynEditor(el, api, c, ['gain', 'ceil', 'rel'], '#ef5b55'); },

  /* ------------------------------------------------------------ Reverb */

  HB.register({
    type: 'effect', id: 'hb.fx.reverb', name: 'Space Reverb', short: 'Reverb', category: 'Space', color: '#6c7dff', icon: 'headphones', order: 1,

      { id: 'decay', name: 'Decay', min: 0.3, max: 12, def: 2.4, curve: 'log', unit: 's' },
      { id: 'pre', name: 'Pre-delay', min: 0, max: 200, def: 18, unit: 'ms' },
      { id: 'damp', name: 'Damping', min: 0, max: 1, def: 0.45, unit: '%' },
      { id: 'lo', name: 'Low Cut', min: 20, max: 1000, def: 120, curve: 'log', unit: 'Hz' },
      { id: 'hi', name: 'High Cut', min: 1500, max: 20000, def: 12000, curve: 'log', unit: 'Hz' },
      { id: 'width', name: 'Width', min: 0, max: 1, def: 1, unit: '%' },
      { id: 'mix', name: 'Mix', min: 0, max: 1, def: 0.25, unit: '%' },
    ],
    presets: [
      { name: 'Small Room', params: { type: 0, decay: 0.7, pre: 5, damp: 0.6 } }, { name: 'Concert Hall', params: { type: 1, decay: 2.8, pre: 22 } },
      { name: 'Vocal Plate', params: { type: 2, decay: 1.8, pre: 35, damp: 0.3, lo: 200 } }, { name: 'Drum Chamber', params: { type: 3, decay: 1.1, pre: 8, damp: 0.5 } },

        destroy() { clearTimeout(tm); try { host.input.disconnect(); } catch (e) {} },

  /* ------------------------------------------------------------ Delay */
  HB.register({
    type: 'effect', id: 'hb.fx.delay', name: 'Stereo Delay', short: 'Delay', category: 'Space', color: '#38c6d9', icon: 'cycle', order: 2,
    description: 'Tempo sync · ping-pong · feedback filter',
    params: [
      { id: 'sync', name: 'Tempo Sync', type: 'bool', def: 1, group: 'Time' },
      { id: 'divL', name: 'Left', options: D.divNames, def: 7, group: 'Time' },
      { id: 'divR', name: 'Right', options: D.divNames, def: 7, group: 'Time' },
      { id: 'msL', name: 'Left ms', min: 1, max: 2000, def: 375, curve: 'log', unit: 'ms', group: 'Time' },
      { id: 'msR', name: 'Right ms', min: 1, max: 2000, def: 375, curve: 'log', unit: 'ms', group: 'Time' },
      { id: 'ping', name: 'Ping-Pong', type: 'bool', def: 1, group: 'Feedback' },
      { id: 'fb', name: 'Feedback', min: 0, max: 0.95, def: 0.38, unit: '%', group: 'Feedback' },
      { id: 'lo', name: 'Low Cut', min: 20, max: 2000, def: 180, curve: 'log', unit: 'Hz', group: 'Feedback' },
      { id: 'hi', name: 'High Cut', min: 1000, max: 20000, def: 6500, curve: 'log', unit: 'Hz', group: 'Feedback' },
      { id: 'mix', name: 'Mix', min: 0, max: 1, def: 0.25, unit: '%', group: 'Output' },
    ],
    presets: [
      { name: '1/8 Dotted Ping-Pong', params: { divL: 7, divR: 7, ping: 1, fb: 0.38 } }, { name: 'Slapback', params: { sync: 0, msL: 95, msR: 110, ping: 0, fb: 0.1, hi: 4000 } },
      { name: '1/4 Echo', params: { divL: 3, divR: 3, ping: 0, fb: 0.45 } }, { name: 'Dark Tape', params: { divL: 6, divR: 7, fb: 0.55, hi: 2600, lo: 300 } },
    ],
    create(host) {
      const ctx = host.ctx, P = host.params, mx = mixer(ctx, host);
      const sp = ctx.createChannelSplitter(2), mg = ctx.createChannelMerger(2), dl = ctx.createDelay(4), dr = ctx.createDelay(4);
      const fl = ctx.createGain(), fr = ctx.createGain(), loL = ctx.createBiquadFilter(), hiL = ctx.createBiquadFilter(), loR = ctx.createBiquadFilter(), hiR = ctx.createBiquadFilter();
      const inL = ctx.createGain(), inR = ctx.createGain(), mono = ctx.createGain();
      [loL, loR].forEach(f => { f.type = 'highpass'; f.Q.value = 0.5; }); [hiL, hiR].forEach(f => { f.type = 'lowpass'; f.Q.value = 0.5; });
      host.input.connect(sp); sp.connect(inL, 0); sp.connect(inR, 1); sp.connect(mono, 0); sp.connect(mono, 1); mono.gain.value = 0.5;
      dl.connect(loL); loL.connect(hiL); dr.connect(loR); loR.connect(hiR);

        [inL, inR, mono, fl, fr].forEach(n => { try { n.disconnect(); } catch (e) {} });
