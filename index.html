        const bpm = host.bpm();
        D.smooth(dl.delayTime, P.sync ? D.divSec(P.divL, bpm) : P.msL / 1000, t || ctx.currentTime, 0.05);
        D.smooth(dr.delayTime, P.sync ? D.divSec(P.divR, bpm) : P.msR / 1000, t || ctx.currentTime, 0.05);
      }
      wire(); times();
      host.on('tempo', () => times());
      return {
        setParam(id, v, t) {
          if (['sync', 'divL', 'divR', 'msL', 'msR'].includes(id)) times(t);
          else if (id === 'ping') { if (!!v !== ping) wire(); }
          else if (id === 'fb') { D.smooth(fl.gain, v, t); D.smooth(fr.gain, v, t); }
          else if (id === 'lo') { D.smooth(loL.frequency, v, t); D.smooth(loR.frequency, v, t); }
          else if (id === 'hi') { D.smooth(hiL.frequency, v, t); D.smooth(hiR.frequency, v, t); }
          else if (id === 'mix') mx.set(v, t);
        },
        destroy() { try { host.input.disconnect(); } catch (e) {} },
      };
    },
  });
})();

<script>/* plugins/fx-color.js */
/* Modulation, distortion, filter and utility effects. */
(() => {
  const D = HB.dsp, MU = HB.music;
  const mixer = (ctx, host) => { const dry = ctx.createGain(), wet = ctx.createGain(); host.input.connect(dry); dry.connect(host.output); wet.connect(host.output); return { dry, wet, set(m, t) { D.smooth(dry.gain, Math.min(1, 2 * (1 - m)), t); D.smooth(wet.gain, Math.min(1, 2 * m), t); } }; };
  const osc = (ctx, f, type = 'sine') => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.start(); return o; };

  /* ------------------------------------------------------------ Chorus */
  HB.register({
    type: 'effect', id: 'hb.fx.chorus', name: 'Chorus', short: 'Chorus', category: 'Modulation', color: '#3ec6d9', icon: 'cycle', order: 1,
    description: 'Two-voice stereo chorus',
    params: [
      { id: 'rate', name: 'Rate', min: 0.05, max: 6, def: 0.6, curve: 'log', unit: 'Hz' }, { id: 'depth', name: 'Depth', min: 0, max: 1, def: 0.5, unit: '%' },
      { id: 'delay', name: 'Delay', min: 3, max: 30, def: 12, unit: 'ms' }, { id: 'fb', name: 'Feedback', min: 0, max: 0.8, def: 0.1, unit: '%' }, { id: 'mix', name: 'Mix', min: 0, max: 1, def: 0.45, unit: '%' },
    ],
    presets: [{ name: 'Subtle', params: { rate: 0.4, depth: 0.35, mix: 0.35 } }, { name: '80s Wide', params: { rate: 0.9, depth: 0.7, mix: 0.55 } }, { name: 'Detune Double', params: { rate: 0.15, depth: 0.2, delay: 22, mix: 0.5 } }],
    create(host) {
      const ctx = host.ctx, P = host.params, mx = mixer(ctx, host), mg = ctx.createChannelMerger(2);
      const lines = [0, 1].map(i => { const d = ctx.createDelay(0.1), lfo = osc(ctx, P.rate * (i ? 1.13 : 1)), g = ctx.createGain(), fb = ctx.createGain(); lfo.connect(g); g.connect(d.delayTime); host.input.connect(d); d.connect(fb); fb.connect(d); d.connect(mg, 0, i); return { d, lfo, g, fb }; });
      mg.connect(mx.wet);
      return {
        setParam(id, v, t) {
          lines.forEach((l, i) => {
            if (id === 'rate') D.smooth(l.lfo.frequency, v * (i ? 1.13 : 1), t);
            else if (id === 'depth') D.smooth(l.g.gain, v * 0.004, t);
            else if (id === 'delay') D.smooth(l.d.delayTime, v / 1000 * (i ? 1.15 : 1), t);
            else if (id === 'fb') D.smooth(l.fb.gain, v, t);
          });
          if (id === 'mix') mx.set(v, t);
        },
        destroy() { lines.forEach(l => l.lfo.stop()); try { host.input.disconnect(); } catch (e) {} },
      };
    },
  });

  /* ------------------------------------------------------------ Flanger */
  HB.register({
    type: 'effect', id: 'hb.fx.flanger', name: 'Flanger', short: 'Flanger', category: 'Modulation', color: '#38c6d9', icon: 'cycle', order: 2,
    description: 'Jet sweep',
    params: [{ id: 'rate', name: 'Rate', min: 0.02, max: 5, def: 0.25, curve: 'log', unit: 'Hz' }, { id: 'depth', name: 'Depth', min: 0, max: 1, def: 0.7, unit: '%' }, { id: 'fb', name: 'Feedback', min: 0, max: 0.92, def: 0.6, unit: '%' }, { id: 'mix', name: 'Mix', min: 0, max: 1, def: 0.5, unit: '%' }],
    presets: [{ name: 'Jet Plane', params: { rate: 0.12, depth: 0.9, fb: 0.85 } }, { name: 'Gentle Sweep', params: { rate: 0.3, depth: 0.5, fb: 0.4, mix: 0.4 } }],
    create(host) {
      const ctx = host.ctx, P = host.params, mx = mixer(ctx, host), mg = ctx.createChannelMerger(2);
      const lines = [0, 1].map(i => { const d = ctx.createDelay(0.03), lfo = osc(ctx, P.rate, 'triangle'), g = ctx.createGain(), fb = ctx.createGain(); d.delayTime.value = 0.004; lfo.connect(g); g.connect(d.delayTime); host.input.connect(d); d.connect(fb); fb.connect(d); d.connect(mg, 0, i); return { d, lfo, g, fb }; });
      lines[1].lfo.frequency.value = P.rate * 1.02;
      mg.connect(mx.wet);
      return {
        setParam(id, v, t) {
          lines.forEach((l, i) => { if (id === 'rate') D.smooth(l.lfo.frequency, v * (i ? 1.02 : 1), t); else if (id === 'depth') D.smooth(l.g.gain, v * 0.0035, t); else if (id === 'fb') D.smooth(l.fb.gain, v, t); });
          if (id === 'mix') mx.set(v, t);
        },
        destroy() { lines.forEach(l => l.lfo.stop()); try { host.input.disconnect(); } catch (e) {} },
      };
    },
  });

  /* ------------------------------------------------------------ Phaser */
  HB.register({
    type: 'effect', id: 'hb.fx.phaser', name: 'Phaser', short: 'Phaser', category: 'Modulation', color: '#3fc26b', icon: 'cycle', order: 3,
    description: 'All-pass stage sweep',
    params: [{ id: 'rate', name: 'Rate', min: 0.02, max: 8, def: 0.4, curve: 'log', unit: 'Hz' }, { id: 'depth', name: 'Depth', min: 0, max: 1, def: 0.7, unit: '%' }, { id: 'freq', name: 'Center', min: 150, max: 6000, def: 900, curve: 'log', unit: 'Hz' }, { id: 'stages', name: 'Stages', options: ['4', '6', '8', '12'], def: 1 }, { id: 'fb', name: 'Feedback', min: 0, max: 0.9, def: 0.4, unit: '%' }, { id: 'mix', name: 'Mix', min: 0, max: 1, def: 0.5, unit: '%' }],
    presets: [{ name: 'Classic 4-Stage', params: { stages: 0, rate: 0.5, fb: 0.3 } }, { name: 'Deep 12-Stage', params: { stages: 3, rate: 0.15, depth: 0.9, fb: 0.6 } }],
    create(host) {
      const ctx = host.ctx, P = host.params, mx = mixer(ctx, host), lfo = osc(ctx, P.rate), lg = ctx.createGain(), fb = ctx.createGain(), inG = ctx.createGain();
      lfo.connect(lg); host.input.connect(inG);
      const aps = Array.from({ length: 12 }, () => { const a = ctx.createBiquadFilter(); a.type = 'allpass'; a.Q.value = 0.6; lg.connect(a.detune); return a; });
      function wire() {
        [inG, fb, ...aps].forEach(n => { try { n.disconnect(); } catch (e) {} });
        aps.forEach(a => lg.connect(a.detune));
        const n = [4, 6, 8, 12][P.stages | 0]; let cur = inG;
        for (let i = 0; i < n; i++) { cur.connect(aps[i]); cur = aps[i]; }
        cur.connect(mx.wet); cur.connect(fb); fb.connect(inG);
      }
      wire();
      return {
        setParam(id, v, t) {
          if (id === 'rate') D.smooth(lfo.frequency, v, t); else if (id === 'depth') D.smooth(lg.gain, v * 2400, t);
          else if (id === 'freq') aps.forEach(a => D.smooth(a.frequency, v, t)); else if (id === 'stages') wire();
          else if (id === 'fb') D.smooth(fb.gain, v, t); else if (id === 'mix') mx.set(v, t);
        },
        destroy() { lfo.stop(); try { host.input.disconnect(); } catch (e) {} },
      };
    },
  });

  /* ------------------------------------------------------------ Tremolo / Auto-pan */
  HB.register({
    type: 'effect', id: 'hb.fx.trem', name: 'Tremolo · Auto Pan', short: 'Tremolo', category: 'Modulation', color: '#ee6aa8', icon: 'cycle', order: 4,
    description: 'Volume or pan moving in time with the beat',
    params: [{ id: 'mode', name: 'Mode', options: ['Tremolo', 'Auto Pan'], def: 0 }, { id: 'shape', name: 'Shape', options: ['Sine', 'Triangle', 'Square'], def: 0 }, { id: 'sync', name: 'Tempo Sync', type: 'bool', def: 1 }, { id: 'div', name: 'Division', options: D.divNames, def: 9 }, { id: 'rate', name: 'Rate', min: 0.1, max: 20, def: 4, curve: 'log', unit: 'Hz' }, { id: 'depth', name: 'Depth', min: 0, max: 1, def: 0.6, unit: '%' }],
    presets: [{ name: 'Surf Tremolo', params: { mode: 0, div: 9, depth: 0.7 } }, { name: 'Slow Auto Pan', params: { mode: 1, div: 3, depth: 0.8 } }, { name: 'Helicopter Gate', params: { mode: 0, shape: 2, div: 11, depth: 1 } }],
    create(host) {
      const ctx = host.ctx, P = host.params, g = ctx.createGain(), pan = ctx.createStereoPanner(), lfo = osc(ctx, 4), lg = ctx.createGain(), pg = ctx.createGain();
      host.input.connect(g); g.connect(pan); pan.connect(host.output); lfo.connect(lg); lg.connect(g.gain); lfo.connect(pg); pg.connect(pan.pan);
      const rate = () => (P.sync ? 1 / D.divSec(P.div, host.bpm()) : P.rate);
      function apply(t) {
        t = t || ctx.currentTime; lfo.type = ['sine', 'triangle', 'square'][P.shape | 0]; D.smooth(lfo.frequency, rate(), t);
        const trem = (P.mode | 0) === 0;
        D.smooth(g.gain, trem ? 1 - P.depth / 2 : 1, t); D.smooth(lg.gain, trem ? P.depth / 2 : 0, t); D.smooth(pg.gain, trem ? 0 : P.depth, t);
      }
      apply(); host.on('tempo', () => apply());
      return { setParam: (id, v, t) => apply(t), destroy() { lfo.stop(); try { host.input.disconnect(); } catch (e) {} } };
    },
  });

  /* ------------------------------------------------------------ Drive */
  const DT = ['Soft', 'Tube', 'Hard', 'Fuzz', 'Fold', 'Crush'], DK = ['soft', 'tube', 'hard', 'fuzz', 'fold', 'crush'];
  HB.register({
    type: 'effect', id: 'hb.fx.drive', name: 'Drive', short: 'Drive', category: 'Distortion', color: '#ef5b55', icon: 'fx', order: 1,
    description: 'Six flavors from saturation to fuzz',
    params: [{ id: 'type', name: 'Type', options: DT, def: 1 }, { id: 'drive', name: 'Drive', min: 0, max: 1, def: 0.35, unit: '%' }, { id: 'tone', name: 'Tone', min: 300, max: 20000, def: 9000, curve: 'log', unit: 'Hz' }, { id: 'out', name: 'Output', min: -24, max: 6, def: -3, unit: 'dB' }, { id: 'mix', name: 'Mix', min: 0, max: 1, def: 1, unit: '%' }],
    presets: [{ name: 'Warm Tape', params: { type: 1, drive: 0.2, tone: 12000 } }, { name: 'Guitar Amp', params: { type: 2, drive: 0.55, tone: 4500 } }, { name: 'Fuzz Box', params: { type: 3, drive: 0.8, tone: 6000, out: -8 } }, { name: 'Lo-Fi Crush', params: { type: 5, drive: 0.6, tone: 7000 } }],
    create(host) {
      const ctx = host.ctx, P = host.params, mx = mixer(ctx, host), pre = ctx.createGain(), sh = ctx.createWaveShaper(), tn = ctx.createBiquadFilter(), out = ctx.createGain();
      sh.oversample = '4x'; tn.type = 'lowpass'; tn.Q.value = 0.5;
      host.input.connect(pre); pre.connect(sh); sh.connect(tn); tn.connect(out); out.connect(mx.wet);
      const curve = () => { sh.curve = D.shaper(DK[P.type | 0], P.drive); };
      return {
        setParam(id, v, t) { if (id === 'type' || id === 'drive') curve(); else if (id === 'tone') D.smooth(tn.frequency, v, t); else if (id === 'out') D.smooth(out.gain, MU.dbToGain(v), t); else if (id === 'mix') mx.set(v, t); },
        destroy() { try { host.input.disconnect(); } catch (e) {} },
      };
    },
  });

  /* ------------------------------------------------------------ Bitcrusher (worklet) */
  const CRUSH = '(' + function () {
    class C extends AudioWorkletProcessor {
      static get parameterDescriptors() { return [{ name: 'bits', defaultValue: 8, minValue: 1, maxValue: 16 }, { name: 'down', defaultValue: 4, minValue: 1, maxValue: 64 }, { name: 'mix', defaultValue: 1, minValue: 0, maxValue: 1 }]; }
      constructor() { super(); this.h = [0, 0]; this.c = 0; }
      process(inp, out, p) {
        const i = inp[0], o = out[0]; if (!i || !i.length) return true;
        const bits = p.bits[0], down = p.down[0], mix = p.mix[0], q = Math.pow(2, bits - 1);
        for (let ch = 0; ch < o.length; ch++) {
          const x = i[ch] || i[0], y = o[ch]; let c = this.c, hv = this.h[ch] || 0;
          for (let s = 0; s < y.length; s++) { c += 1; if (c >= down) { c -= down; hv = Math.round(x[s] * q) / q; } y[s] = x[s] * (1 - mix) + hv * mix; }
          this.h[ch] = hv; if (ch === o.length - 1) this.c = c;
        }
        return true;
      }
    }
    registerProcessor('hb-crusher', C);
  } + ')();';
  HB.register({
    type: 'effect', id: 'hb.fx.crush', name: 'Bitcrusher', short: 'Crusher', category: 'Distortion', color: '#f58c3b', icon: 'fx', order: 2,
    description: 'Reduce bit depth and sample rate',
    params: [{ id: 'bits', name: 'Beat', min: 1, max: 16, def: 8, unit: 'bit', fmt: v => v.toFixed(1) + 'bit' }, { id: 'down', name: 'Downsample', min: 1, max: 48, def: 4, curve: 'log', unit: 'x' }, { id: 'mix', name: 'Mix', min: 0, max: 1, def: 1, unit: '%' }],
    presets: [{ name: '8-Bit Game', params: { bits: 6, down: 6 } }, { name: 'Subtle Lo-Fi', params: { bits: 11, down: 2, mix: 0.6 } }],
    async create(host) {
      await host.loadWorklet('hb-crusher', CRUSH, 'worklet-hb-crusher.js');
      const n = new AudioWorkletNode(host.ctx, 'hb-crusher', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2] });
      host.input.connect(n); n.connect(host.output);
      return { setParam(id, v, t) { const p = n.parameters.get(id); if (p) D.smooth(p, v, t); }, destroy() { try { host.input.disconnect(); } catch (e) {} n.disconnect(); } };
    },
  });

  /* ------------------------------------------------------------ Auto filter */
  HB.register({
    type: 'effect', id: 'hb.fx.filter', name: 'Auto Filter', short: 'Filter', category: 'EQ & Filter', color: '#ad6cf3', icon: 'wave', order: 2,
    description: 'Resonant filter · tempo-synced sweep',
    params: [{ id: 'type', name: 'Type', options: ['Low-pass', 'Band-pass', 'High-pass'], def: 0 }, { id: 'cut', name: 'Cutoff', min: 40, max: 18000, def: 1200, curve: 'log', unit: 'Hz' }, { id: 'res', name: 'Resonance', min: 0.3, max: 20, def: 4, curve: 'log' }, { id: 'sync', name: 'Tempo Sync', type: 'bool', def: 1 }, { id: 'div', name: 'Division', options: D.divNames, def: 3 }, { id: 'rate', name: 'Rate', min: 0.05, max: 16, def: 1, curve: 'log', unit: 'Hz' }, { id: 'depth', name: 'LFO Depth', min: 0, max: 1, def: 0.5, unit: '%' }, { id: 'mix', name: 'Mix', min: 0, max: 1, def: 1, unit: '%' }],
    presets: [{ name: 'House Filter Sweep', params: { type: 0, cut: 800, res: 6, div: 0, depth: 0.8 } }, { name: 'Wah', params: { type: 1, cut: 900, res: 8, div: 6, depth: 0.7 } }, { name: 'Telephone', params: { type: 1, cut: 1500, res: 2, depth: 0 } }],
    create(host) {
      const ctx = host.ctx, P = host.params, mx = mixer(ctx, host), f1 = ctx.createBiquadFilter(), f2 = ctx.createBiquadFilter(), lfo = osc(ctx, 1), lg = ctx.createGain();
      host.input.connect(f1); f1.connect(f2); f2.connect(mx.wet); lfo.connect(lg); lg.connect(f1.detune); lg.connect(f2.detune); f2.Q.value = 0.7;
      const apply = t => { t = t || ctx.currentTime; const ty = ['lowpass', 'bandpass', 'highpass'][P.type | 0]; f1.type = f2.type = ty; D.smooth(f1.frequency, P.cut, t); D.smooth(f2.frequency, P.cut, t); D.smooth(f1.Q, P.res, t); D.smooth(lfo.frequency, P.sync ? 1 / D.divSec(P.div, host.bpm()) : P.rate, t); D.smooth(lg.gain, P.depth * 3600, t); mx.set(P.mix, t); };
      apply(); host.on('tempo', () => apply());
      return { setParam: (id, v, t) => apply(t), destroy() { lfo.stop(); try { host.input.disconnect(); } catch (e) {} } };
    },
  });

  /* ------------------------------------------------------------ Utility */
  HB.register({
    type: 'effect', id: 'hb.fx.util', name: 'Gain · Stereo', short: 'Gain', category: 'Utility', color: '#8e98a5', icon: 'gear', order: 1,
    description: 'Gain · pan · stereo width · mono',
    params: [{ id: 'gain', name: 'Gain', min: -24, max: 24, def: 0, unit: 'dB' }, { id: 'pan', name: 'Pan', min: -1, max: 1, def: 0, unit: 'pan' }, { id: 'width', name: 'Width', min: 0, max: 2, def: 1, fmt: v => Math.round(v * 100) + '%' }, { id: 'mono', name: 'Mono', type: 'bool', def: 0 }, { id: 'invL', name: 'Invert Left Phase', type: 'bool', def: 0 }, { id: 'invR', name: 'Invert Right Phase', type: 'bool', def: 0 }],
    create(host) {
      const ctx = host.ctx, P = host.params, g = ctx.createGain(), sp = ctx.createChannelSplitter(2), mg = ctx.createChannelMerger(2), gl = ctx.createGain(), gr = ctx.createGain(), wd = D.widthNode(ctx), pan = ctx.createStereoPanner();
      host.input.connect(g); g.connect(sp); sp.connect(gl, 0); sp.connect(gr, 1); gl.connect(mg, 0, 0); gr.connect(mg, 0, 1); mg.connect(wd.input); wd.output.connect(pan); pan.connect(host.output);
      const apply = t => { t = t || ctx.currentTime; D.smooth(g.gain, MU.dbToGain(P.gain), t); D.smooth(pan.pan, P.pan, t); wd.set(P.mono ? 0 : P.width, t); D.smooth(gl.gain, P.invL ? -1 : 1, t); D.smooth(gr.gain, P.invR ? -1 : 1, t); };
      apply();
      return { setParam: (id, v, t) => apply(t), destroy() { try { host.input.disconnect(); } catch (e) {} } };
    },
  });
})();

</script>
<script>HB.boot();</script>
